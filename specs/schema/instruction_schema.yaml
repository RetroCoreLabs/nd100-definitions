$schema: http://json-schema.org/draft-07/schema#

type: object
required:
  - name
  - description
  - opcode
  - format
  - category
  - privilege
  - instruction_class
  - flags_affected
  - exits
properties:
  name:
    type: string
    pattern: "^[A-Z][A-Z0-9_]*$"
    description: "Instruction name in uppercase (e.g., 'ADD', 'SUB', 'AND')"
  description:
    type: string
    minLength: 1
    description: "Basic description of what the instruction does"
  detailed_description:
    type: string
    description: "Detailed description with technical information and usage notes"
  extended_description:
    type: string
    description: "More text after the detailed description"
  before_use:
    type: string
    description: "What must be set up before the instruction is used"
  manual_refs:
    type: array
    description: "Where the manuals describe the instruction. Manual ids are listed in cpu.yaml metadata.manuals; page is the printed page number"
    items:
      type: object
      required: [manual]
      properties:
        manual: {type: string}
        page: {type: integer}
        section: {type: string}
  opcode:
    type: string
    pattern: "^0[0-7]{6}$"
    description: "Instruction opcode in octal format (6 digits)"
  mask:
    type: string
    pattern: "^[01_]+$"
    description: "Bit mask for opcode (may be omitted if instruction_class is defined)"
  format:
    type: string
    minLength: 1
    description: "Assembly format of the instruction"
  category:
    type: string
    minLength: 1
    description: "Category of the instruction: a name defined in specs/categories.yaml (the loader rejects any other)"
  instruction_class:
    type: string
    minLength: 1
    description: "Instruction class (must be a valid class defined in cpu.yaml)"
  privilege:
    type: string
    enum: [user, privileged]   # what each means: cpu.yaml metadata.privilege_levels
    description: "Privilege level required to execute the instruction"
  isalias:
    type: boolean
    description: "Whether this instruction is an alias for another instruction"
  operands:
    type: array
    items:
      type: object
      required:
        - name
        - description
        - bits
      properties:
        name:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9_]*$"
          description: "Operand name (must start with a letter)"
        type:
          type: string
          description: "Operand type (e.g., uint5, addressing_mode, displacement, enum)"
        description:
          type: string
          minLength: 1
          description: "Description of the operand"
        bits:
          type: string
          pattern: "^[0-9]+-[0-9]+$"
          description: "Bit range in format start-end (e.g., '15-0')"
        enum:
          type: array
          items:
            type: object
            required:
              - name
              - value
            properties:
              name:
                type: string
                description: "Enum option name"
              value:
                type: string
                description: "Enum option value"
        value:
          type: string
          description: "Optional fixed value for the operand"
  flags_affected:
    type: array
    items:
      type: string
      enum: [C, O, Q, Z]
    description: "List of flags affected by this instruction"
  flags:
    type: object
    properties:
      C:
        type: string
        description: "Effect on Carry flag"
      O:
        type: string
        description: "Effect on Overflow flag"
      Q:
        type: string
        description: "Effect on Dynamic Overflow flag"
      Z:
        type: string
        description: "Effect on Error flag"
  pseudocode:
    type: string
    description: "Pseudocode showing the instruction's behavior"
  examples:
    type: array
    items:
      type: object
      required:
        - description
        - code
      properties:
        description:
          type: string
          minLength: 1
          description: "Description of what the example demonstrates"
        code:
          type: string
          minLength: 1
          description: "Example assembly code"
  inline_words:
    type: integer
    minimum: 0
    description: >-
      Number of data words that follow the instruction word in memory and are read by the
      instruction (for example the stack demand after ENTR). They are not code. Omitted = 0.
  exits:
    type: array
    minItems: 1
    description: >-
      Every place execution can continue after this instruction (traps, page faults and
      interrupts are not listed). A plain instruction has one exit: offset 1, when always.
    items:
      type: object
      required:
        - when
      oneOf:
        - required: [offset]
        - required: [target]
      properties:
        offset:
          type: integer
          description: >-
            Fixed exit: words counted from the instruction's own address.
            1 = the next word, 2 = skip one word.
        target:
          type: string
          enum:
            - effective_address        # JMP, JPL: the memory address the operand gives
            - displacement             # conditional jumps: own address + sign-extended 8-bit displacement
            - result                   # register ops and bit ops whose destination is P: P = the new value
            - register                 # P is loaded from the register named in 'register'
            - stack_link               # LEAVE: P = LINK, the stack word at (B) - 200 octal
            - stack_link_minus_1       # ELEAV: P = LINK - 1
            - executed_instruction     # EXR: the exits of the instruction taken from the register
          description: "Exit whose address is not a fixed offset"
        register:
          type: string
          description: "Register P is loaded from, when target is 'register'"
        when:
          type: string
          enum:
            - always                   # the only exit, or taken every time
            - ok                       # normal return of an instruction that can fail
            - error                    # error return of an instruction that can fail
            - taken                    # the test/skip/jump condition is true
            - not_taken                # the test/skip/jump condition is false
          description: "When this exit is used; 'condition' says it in words"
        condition:
          type: string
          description: "Plain words: what makes this exit happen"
        note:
          type: string
          description: "Extra facts about this exit"
  exits_source:
    type: string
    description: >-
      Where the exits were read from: the nd100x source file, line and function, and the nd100x commit.
  generated_bit_format:
    type: string
    description: "Auto-generated bit format visualization" 