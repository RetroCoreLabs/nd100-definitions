register:
  name: PIE
  description: Priority Interrupt Enable register that controls which priority interrupts are enabled
  size: 16
  type: control
  bits:
    - name: INT0
      position: 0
      size: 1
      description: Interrupt Level 0 Enable - Enables highest priority interrupt
    - name: INT1
      position: 1
      size: 1
      description: Interrupt Level 1 Enable - Enables second highest priority interrupt
    - name: INT2
      position: 2
      size: 1
      description: Interrupt Level 2 Enable - Enables third highest priority interrupt
    - name: INT3
      position: 3
      size: 1
      description: Interrupt Level 3 Enable - Enables fourth highest priority interrupt
    - name: INT4
      position: 4
      size: 1
      description: Interrupt Level 4 Enable - Enables fifth highest priority interrupt
    - name: INT5
      position: 5
      size: 1
      description: Interrupt Level 5 Enable - Enables sixth highest priority interrupt
    - name: INT6
      position: 6
      size: 1
      description: Interrupt Level 6 Enable - Enables seventh highest priority interrupt
    - name: INT7
      position: 7
      size: 1
      description: Interrupt Level 7 Enable - Enables eighth highest priority interrupt
    - name: INT8
      position: 8
      size: 1
      description: Interrupt Level 8 Enable - Enables ninth highest priority interrupt
    - name: INT9
      position: 9
      size: 1
      description: Interrupt Level 9 Enable - Enables tenth highest priority interrupt
    - name: INT10
      position: 10
      size: 1
      description: Interrupt Level 10 Enable - Enables eleventh highest priority interrupt
    - name: INT11
      position: 11
      size: 1
      description: Interrupt Level 11 Enable - Enables twelfth highest priority interrupt
    - name: INT12
      position: 12
      size: 1
      description: Interrupt Level 12 Enable - Enables thirteenth highest priority interrupt
    - name: INT13
      position: 13
      size: 1
      description: Interrupt Level 13 Enable - Enables fourteenth highest priority interrupt
    - name: INT14
      position: 14
      size: 1
      description: Interrupt Level 14 Enable - Enables second lowest priority interrupt
    - name: INT15
      position: 15
      size: 1
      description: Interrupt Level 15 Enable - Enables lowest priority interrupt
  program_level: false
  read_only: false
  write_only: false
  hidden: false
  group: interrupt 