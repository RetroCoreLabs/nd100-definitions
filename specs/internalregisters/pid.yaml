register:
  name: PID
  description: Priority Interrupt Detect register that indicates which priority interrupts have been detected
  size: 16
  type: control
  bits:
    - name: INT0
      position: 0
      size: 1
      description: Interrupt Level 0 - Highest priority interrupt detected
    - name: INT1
      position: 1
      size: 1
      description: Interrupt Level 1 - Second highest priority interrupt detected
    - name: INT2
      position: 2
      size: 1
      description: Interrupt Level 2 - Third highest priority interrupt detected
    - name: INT3
      position: 3
      size: 1
      description: Interrupt Level 3 - Fourth highest priority interrupt detected
    - name: INT4
      position: 4
      size: 1
      description: Interrupt Level 4 - Fifth highest priority interrupt detected
    - name: INT5
      position: 5
      size: 1
      description: Interrupt Level 5 - Sixth highest priority interrupt detected
    - name: INT6
      position: 6
      size: 1
      description: Interrupt Level 6 - Seventh highest priority interrupt detected
    - name: INT7
      position: 7
      size: 1
      description: Interrupt Level 7 - Eighth highest priority interrupt detected
    - name: INT8
      position: 8
      size: 1
      description: Interrupt Level 8 - Ninth highest priority interrupt detected
    - name: INT9
      position: 9
      size: 1
      description: Interrupt Level 9 - Tenth highest priority interrupt detected
    - name: INT10
      position: 10
      size: 1
      description: Interrupt Level 10 - Eleventh highest priority interrupt detected
    - name: INT11
      position: 11
      size: 1
      description: Interrupt Level 11 - Twelfth highest priority interrupt detected
    - name: INT12
      position: 12
      size: 1
      description: Interrupt Level 12 - Thirteenth highest priority interrupt detected
    - name: INT13
      position: 13
      size: 1
      description: Interrupt Level 13 - Fourteenth highest priority interrupt detected
    - name: INT14
      position: 14
      size: 1
      description: Interrupt Level 14 - Second lowest priority interrupt detected
    - name: INT15
      position: 15
      size: 1
      description: Interrupt Level 15 - Lowest priority interrupt detected
  program_level: false
  read_only: true
  write_only: false
  hidden: false
  group: interrupt 