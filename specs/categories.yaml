# The instruction categories: one entry per value of 'category' in instructions/*.yaml.
# Every tool that groups instructions (the Ghidra plugin's PDF manual, the documentation site,
# the Markdown generator) reads its names, order, sources and text from here.
#
# name:        exactly the 'category' value the instruction files use
# sources:     where the grouping comes from - a manual (see 'manuals' in cpu.yaml) and the
#              section or pages of that manual
# description: Markdown. Left out when the manuals give the group no text of its own.
# Order: the order of the groups in ND-06.029.1 (ND-110 Instruction Set).
categories:
  - name: "Register Instructions"
    sources:
      - manual: "ND-06.029.1"
        pages: "43-58"
    description: |
      These instructions specify operations between source (sr) and destination (dr) registers.
  - name: "Memory Transfer: Load"
    sources:
      - manual: "ND-06.014.2A"
        section: "3.2.1.3 Load Instructions"
      - manual: "ND-06.029.1"
        pages: "60-61"
