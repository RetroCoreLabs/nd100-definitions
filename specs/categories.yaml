      - manual: "ND-06.029.1"
        pages: "62-64"
  - name: "Memory Transfer: Arithmetic and Logical"
    sources:
      - manual: "ND-06.014.2A"
        section: "3.2.1.4 Arithmetical and Logical Instructions"
      - manual: "ND-06.029.1"
        pages: "65-69"
  - name: "Floating Point Conversion Instructions"
