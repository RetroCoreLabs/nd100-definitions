instruction:
  name: "EXIT"
  description: |
    Return from subroutine

    This compound mnemonic represents the specific COPY instruction: 
      COPY SL DP

    It causes the return from a subroutine by copying the stored return address into the program counter (P register).

  detailed_description: |
    Return from subroutine. EXIT is a combined mnemonic for COPY SL DP (or RADD CLD SL DP): the contents of the L register are copied into the program counter, so execution continues at the return address saved in L.

        (P) <- (L)

    Flags: as for the RADD instruction.

    Example: with (L) = 108 and (P) = 190 (octal), EXIT leaves the subroutine at location 190 and returns to location 108.

  opcode: "0146142"  # Octal
  mask: "1111_1111_1111_1111"  # Matches bit pattern from image
  format: "EXIT" # COPY SL DP
  category: "Register Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 44
  instruction_class: 
  flags_affected: ["C", "O", "Q"]
  privilege: "user"
  isalias: true
  examples:
    - description: "[ (L)=108, (P)=190 ] Leave subroutine at location 190 and return to loaction 108"
      code: "EXIT"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - target: "register"
      register: "L"
      when: "always"
      note: "COPY SL DP: P is loaded from L"
  exits_source: "nd100x src/cpu/cpu_instr.c:1142 regop - COPY with source L and destination P (nd100x commit 936bf30)"
