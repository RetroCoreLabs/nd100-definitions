instruction:
  name: "JXN"
  format: " JXN <displacement>"
  opcode: "0133400"  # Octal format 
  mask: "1111_1111_0000_0000"  # 8 bits displacement,
  description: |
    Condition: Jump if (X) < 0 (jump if X negative)

  detailed_description: |
    If condition true, jump to the address of the program counter plus the value of displacement.
    If condition false, continue program execution at (P) + 1.    

    'displacement' = The eight displacement (disp) bits give a signed range of -128 to 127 locations to be jumped if the condition is true.
  category: "Jump Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 80
  privilege: "user"
  flags_affected: []  # JMP doesn't affect any flags
  instruction_class: "jump_on_condition"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "not X < 0"
    - target: "displacement"
      when: "taken"
      condition: "X < 0"
      note: "the instruction's own address plus the sign-extended 8-bit displacement"
  exits_source: "nd100x src/cpu/cpu_instr.c:4254 opcode_jxn_jump_if_x_negative - jump done in cjp() at line 225 (nd100x commit 936bf30)"
