instruction:
  name: "LDF"  
  description: |
    Load floating accumulator (TAD) from memory (FW)
    Memory format:
     (T) ⟵ EL
     (A) ⟵ EL+1
     (D) ⟵ EL+2

    Load the contents of the memory location pointed to by the effective address into the T register, the contents of the effective address plus one into the A register and the contents of the effective address plus two into the D register.
  opcode: "034000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "LDF <addressing_mode> <disp>"  
  category: "Standard Floating Instructions"
  instruction_class: "memory_transfer" 
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3244 opcode_ldf_load_floating_accumulator - never writes P (nd100x commit 936bf30)"
