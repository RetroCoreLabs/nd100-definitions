instruction:
  name: "AND"
  description: |
    Logical AND to A register
    A ⟵ A & (EA)

    Perform a bitwise AND operation between the contents of the A register and the contents of the memory location pointed to by the effective address, leaving the result in A.

  detailed_description: |
    Logical AND with the A register.

        (A) <- (A) AND (ea)

    The contents of the memory location at the effective address are ANDed with the A register, and the result is left in A. Each bit of the result is one where both A and the effective word have a one, otherwise zero.

    Format: AND <address mode> <disp>

    Affected: (A)

  opcode: "070000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "AND <addressing_mode> <displacement>"
  category: "Memory Transfer: Arithmetic and Logical"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 67
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3147 opcode_and_logical_and_to_a_register - never writes P (nd100x commit 936bf30)"
