instruction:
  name: LXCB
  description: |
    Load the X register from the core table bank (CMBNK).
    
    (X) <--- (ea)
    
    ea = (B) + Δ = CMBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)
  format: LXCB <displacement>
  opcode: "140705"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6643 opcode_lxcb_load_x_from_core_map_bank - never writes P (nd100x commit 936bf30)"
