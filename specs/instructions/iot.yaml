instruction:
  name: IOT
  description: |
    NORD-1 INSTRUCTION (DO NOT USE)

  detailed_description: |
    ND-110 microcode implements this instruction like this:

    1861  000627  % IOT - INSTRUCTION IS PRIVILEGED WHEN RING = 0 OR 1
    1862  000627  %                  AND ILLEGAL    WHEN RING = 2 OR 3
    1863  000627  
    1864  000627  IOT1:     ALUD,NONE           IDBS,ALU            T,JMP               T,PUSH              PVCHK;
    1865  000630            ALUD,NONE           IDBS,ALU            T,JMP               T,HOLD              ILLIN;
   
  opcode: "160000 "  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "IOT <device_register_address>"
  category: "Input/Output Instructions"
  instruction_class:
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "no skip reported"
    - offset: 2
      when: "taken"
      condition: "a device claims the NORD-1 device number and reports skip (SKA)"
  exits_source: "nd100x src/cpu/cpu_instr.c:4570 opcode_iot_nord_1_legacy_do_not_use - line 4610 (nd100x commit 936bf30)"
