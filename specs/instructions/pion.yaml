instruction:
  name: PION
  description: |
    Memory management and interrupt system ON
    
    Enable both the memory management and interrupt systems. This combines the functions of the ION and PON instructions.
  before_use: |
    Check conditions of ION and PON instructions.
  format: PION
  opcode: "150412"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Interrupt Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 127
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5123 opcode_pion_paging_and_interrupt_on - never writes P (nd100x commit 936bf30)"
