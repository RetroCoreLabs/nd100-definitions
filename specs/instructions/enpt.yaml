instruction:
  name: ENPT
  description: |
    Enter segment in page tables.

    A SINTRAN III instruction of the ND-110 microprogram. It walks the chain of core map table entries that starts at the entry in X, writing a page table entry for each page of the segment, and follows the link in word 0 of each entry until X is 0. If an interrupt becomes pending during the walk, P is set back by one and the instruction stops, so it runs again from where it stopped once the interrupt is served. REPT does the same for a reentrant segment.

    Source: the ND-110 Instruction Set manual, ND-06.029.1, page 139, and its PLANC listing in Appendix B (page 169). The OCR of that listing is damaged in places, so only the shape of the loop is given here.

  format: ENPT
  opcode: "140506"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 139
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6115 opcode_enpt_enter_segment_in_page_tables - never writes P (nd100x commit 936bf30)"
