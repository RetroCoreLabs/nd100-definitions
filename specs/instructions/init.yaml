instruction:
  name: "INIT"
  description: |
    Initialize stack. 
    
    Loads the addresses pointed to by B with the stack frame addresses. 
    Sets up 
      LINK  ⟵ L + 1                          {stack start}  
      PREVB ⟵ (B)                            {save current pointer}  
      SMAX  ⟵ stack start address + maximum stack size  
      (B)   ⟵ (B = 200₈) + 200₈              {establish new pointer}  
      STP   ⟵ stack demand + (B)  

    Load the addresses pointed to by **B** with the stack frame addresses.

    Stack overflow and flag error causes an error return, that is the program continues at the address following the stack demand value. 
    In all other cases, the program skips this address to find the return address from the stack.  

    Format:
      INIT 
      <number of words allocated to stack>
      <address of stack start>
      <maximum stack size>
      <flag>
      <address left empty>
      <error return address>
      <return address>

  detailed_description: |
    Initialize stack. Sets up the first stack frame. INIT is followed in memory by a parameter list:

        INIT
        stack demand (number of words for this frame)
        address of stack start
        maximum stack size
        flag
        (word not used by the microprogram)
        error return address
        normal return address

    The stack frame is filled in from these values: LINK gets the return address (L + 1), PREVB gets the old B (the saved pointer), SMAX gets stack start + maximum size, B is set to point into the new frame, and STP gets stack demand + (B).

    A stack overflow or a flag error gives an error return: the program continues at the error return address. Otherwise that word is skipped and the program continues at the normal return address. A flag error means flag bit 0 is not equal to bit 0 of the STS register.
    
  opcode: "0140134" # Octal
  format: "INIT"
  mask: "1111_1111_1111_1111" 
  category: "Stack Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 110
  instruction_class:
  privilege: "user"
  flags_affected:
    - PTM # "Page Table Flag - Status register bit 0 used for flag comparison"

  # Where execution continues after this instruction (see schema field 'exits').
  inline_words: 5
  exits:
    - offset: 6
      when: "error"
      condition: "stack overflow, or the flag word (bit 0) differs from STS bit 0 (PTM)"
    - offset: 7
      when: "ok"
  exits_source: "nd100x src/cpu/cpu_instr.c:4387 opcode_init_initialize_stack - inline words read at P+0..P+3, error gPC += 5 at lines 4398 and 4403, ok gPC += 6 at line 4412 (nd100x commit 936bf30)"
