instruction:
  name: RGLOB
  description: |
    Examine global pointers.
    
    (T) <--- bank number of segment table (STBNK)
    (A) <--- start address within bank (STSRT)
    (D) <--- bank number of core map table (CMBNK)
  format: RGLOB
  opcode: "140501"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5721 opcode_rglob_examine_global_pointers - never writes P (nd100x commit 936bf30)"
