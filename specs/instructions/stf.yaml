instruction:
  name: "STF"  
  description: |
    Store floating accumulator (TAD) to memory (ea)
    Memory format:
     (ea)     ⟵ (T)
     (ea) + 1 ⟵ (A)
     (ea) + 2 ⟵ (D)

    Store the contents of the floating accumulator (T,A and D registers) into the memory location pointed to by the effective address.

  detailed_description: |
    Store floating accumulator (32-bit and 48-bit floating point).

        (ea)     <- (T)
        (ea) + 1 <- (A)
        (ea) + 2 <- (D)

    The floating accumulator (the T, A and D registers) is stored in the memory
    locations starting at the effective address.

    Format: STF <address mode> <disp>      Octal code: 030000

  opcode: "030000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "STF <addressing_mode> <disp>"  
  category: "Memory Transfer: Store"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 63
  instruction_class: "memory_transfer" 
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3210 opcode_stf_store_floating_accumulator - never writes P (nd100x commit 936bf30)"
