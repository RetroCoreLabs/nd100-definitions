instruction:
  name: "ORA"
  description: |
    Logical inclusive OR to A register
    A ⟵ A | (EA)

    Perform a bitwise OR operation between the contents of the A register and the contents of the memory location pointed to by the effective address, leaving the result in A.

  opcode: "074000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "ORA <addressing_mode> <displacement>"
  category: "Memory Transfer: Arithmetic and Logical"
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3177 opcode_ora_logical_or_to_a_register - never writes P (nd100x commit 936bf30)"
