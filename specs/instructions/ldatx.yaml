instruction:
  name: LDATX
  description: |
    Load A register
    
    (A) ⟵ (ea)
    
    Load the contents of the physical memory location pointed to by the effective address into the A register.
  format: LDATX <disp>
  opcode: "143300"  # Octal, Δ denotes 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Memory Transfer Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2866 opcode_ldatx_load_a_register_t_x_relative - never writes P (nd100x commit 936bf30)"
