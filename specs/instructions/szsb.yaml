instruction:
  name: SZSB
  description: |
    Store zero in the segment-table bank (STBNK).
    
    (ea) <--- 0
    
    ea = (B) + Δ = STBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)  
  format: SZSB <displacement>
  opcode: "140706"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 146
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6667 opcode_szsb_store_zero_in_segment_table_bank - never writes P (nd100x commit 936bf30)"
