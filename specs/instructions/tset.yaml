instruction:
  name: TSET
  description: |
    Test and set
    
    (T) points to the virtual memory word to be accessed
    (A) ⟵ memory word addressed by T
    
    The address given by the T register is a logical memory address. It is normally translated into a physical address using page tables (if memory management is on). The contents of the location addressed by T are simultaneously loaded into the A register as the location is written to with all 1s. The memory system is dedicated to this task and no other memory access is allowed during the operation. This can be used for processor synchronization.
    
    The old content of the memory address is always read from the memory and never from cache. The all 1s' data word is never written to cache.

  detailed_description: |
    Test and set.

        (T) points to the virtual memory word to be accessed
        (A) <- memory word addressed by T

    The address in the T register is a logical memory address. It is normally
    translated into a physical address through the page tables (if memory
    management is on). The contents of the location addressed by T are loaded
    into the A register at the same moment as all ones are written into that
    location. The memory system is given over to this one task and no other
    memory access is allowed during the operation. The instruction can be used
    to synchronize processors.

    The old contents are always read from memory, never from the cache. The
    all-ones word is never written to the cache.

    Format: TSET      Octal code: 140123

  format: TSET
  opcode: "140123"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Memory Examine and Test Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 112
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1942 do_tset - never writes P (nd100x commit 936bf30)"
