instruction:
  name: BANC
  description: |
    logical AND with bit complement

    K ⟵ K & (B)0

    Perform a bitwise AND with the contents of the B register and the contents of the K register, leaving the result in K.

  opcode: "177000"  # Octal
  mask: "1111_1111_1000_0000" # top 9 bits are opcode
  format: "BANC"    
  category: "Bit instructions"
  privilege: "user"
  flags_affected:
    - K  # 1-bit accumulator (K)

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1701 do_bops - never writes P (nd100x commit 936bf30)"
