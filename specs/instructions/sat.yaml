instruction:
  name: "SAT"
  description: "Set argument to T"
  opcode: "171000"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "SAT <number>"
  category: "Argument Instruction"
  privilege: "user"
  operands:
    - name: "opcode"        
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  flags_affected:
    - C  # Carry
    - O  # Overflow
  examples:
    - description: "Set the T register to 20₈."
      code: "SAT 20₈"
