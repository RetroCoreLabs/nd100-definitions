instruction:
  name: "SAT"
  description: "Set argument to T"

  detailed_description: |
    Set argument to T.

    The 8-bit argument (bits 0-7 of the instruction) is extended to 16 bits by
    sign extension and the result is loaded into the T register. The argument
    becomes the low byte; the high byte is filled with zeros for a positive
    argument and with ones for a negative argument (given in 2's complement form).

    Octal code: 171000.

    Example:

        SAT 13

    sets the T register to 13 (octal). Bits 8-15 are zero because of the sign
    extension.

  opcode: "171000"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "SAT <number>"
  category: "Argument Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 85
  privilege: "user"
  operands:
    - name: "opcode"        
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  flags_affected:
    - C  # Carry
    - O  # Overflow
  examples:
    - description: "Set the T register to 20₈."
      code: "SAT 20₈"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2401 opcode_sat_set_argument_to_t - never writes P (nd100x commit 936bf30)"
