instruction:
  name: "ELEAV"
  description: |
    Error leave stack.
    
    If an error occurs, leave the stack.
    
    This instruction saves the previous stack pointer in LINK and restores the B register to its previous value (PREVB) before leaving the stack. The stack is left by loading the P register (program counter) with the return address (LINK). The A register is loaded with an error code which is saved in the ERRCODE stack entry (pointed to by B = 173₈).
    
      (B = 200₈) ⟵ (B = 200₈) - 1
      (P)       ⟵ (B = 200₈)   {LINK}
      (B)       ⟵ (B = 177₈)   {PREVB}
      (A)       ⟵ ERRCODE₈
      (B = 173₈) ⟵ (A)         {ERRCODE}
    
    Format:
      ELEAV

  detailed_description: |
    Error leave stack.

        (B - 200) - 1 => B - 200   (LINK)
        A             => B - 173   (ERRCODE)
        (B - 200)     => P         (LINK)
        (B - 177)     => B         (PREVB)

    LINK is decreased by one, the A register (holding an error code) is saved in the ERRCODE entry, the program counter is loaded with the return address in LINK, and B is restored to the previous stack frame (PREVB).

    Format: ELEAV

    The B register always points to a stack frame holding:

        B - 200   LINK    next instruction address (used by LEAVE)
        B - 177   PREVB   previous stack frame address
        B - 176   STP     next stack frame address
        B - 175   SMAX    top of stack address (used to find stack overflow)
        B - 174   reserved for system use
        B - 173   ERRCODE filled with (A) each time ELEAV is executed

    The ND-110 manual says the stack instructions are page-fault tolerant on the ND-110. The ND-100 manual warns that a page fault during a stack instruction can destroy the B register, so on the ND-100 the stack instructions must not be used where page faults can occur.

  opcode: "0140137" # Octal
  format: "ELEAV"
  mask: "1111_1111_1111_1111"
  category: "Stack Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 109
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - target: "stack_link_minus_1"
      when: "always"
      note: "LINK is decremented in the stack, then P is loaded from it: one word before the normal return, which is the error return word of ENTR/INIT"
  exits_source: "nd100x src/cpu/cpu_instr.c:4515 opcode_eleav_error_leave_stack - line 4522 (nd100x commit 936bf30)"
