instruction:
  name: "ELEAV"
  description: |
    Error leave stack.
    
    If an error occurs, leave the stack.
    
    This instruction saves the previous stack pointer in LINK and restores the B register to its previous value (PREVB) before leaving the stack. The stack is left by loading the P register (program counter) with the return address (LINK). The A register is loaded with an error code which is saved in the ERRCODE stack entry (pointed to by B = 173₈).
    
      (B = 200₈) ⟵ (B = 200₈) - 1
      (P)       ⟵ (B = 200₈)   {LINK}
      (B)       ⟵ (B = 177₈)   {PREVB}
      (A)       ⟵ ERRCODE₈
      (B = 173₈) ⟵ (A)         {ERRCODE}
    
    Format:
      ELEAV
  opcode: "0140137" # Octal
  format: "ELEAV"
  mask: "1111_1111_1111_1111"
  category: "Stack Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 109
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - target: "stack_link_minus_1"
      when: "always"
      note: "LINK is decremented in the stack, then P is loaded from it: one word before the normal return, which is the error return word of ENTR/INIT"
  exits_source: "nd100x src/cpu/cpu_instr.c:4515 opcode_eleav_error_leave_stack - line 4522 (nd100x commit 936bf30)"
