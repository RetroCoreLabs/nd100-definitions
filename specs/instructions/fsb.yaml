instruction:
  name: "FSB"
  description: |
    Subtract from floating point accumulator.
    
    The contents of two sequential memory locations, pointed to by the effective address, are subtracted from the contents of the floating point accumulator (A and D registers). 
    The result is held in the accumulator.

  detailed_description: |
    Subtract from floating accumulator. The floating point number in the memory locations pointed to by the effective address is subtracted from the floating accumulator. The result is left in the floating accumulator.

    The ND-100 Reference Manual describes the operand as the effective location and the two following locations, and the floating accumulator as the T, A and D registers.

    Registers and flags affected: T, A, D and TG.

  opcode: "104000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "FSB <addressing_mode> <disp>"
  category: "Memory Transfer: Arithmetic and Logical"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 69
  instruction_class: "memory_transfer"
  privilege: "user"
  flags_affected:
    - Z  # Error

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3335 opcode_fsb_subtract_from_floating_accumulator - never writes P (nd100x commit 936bf30)"
