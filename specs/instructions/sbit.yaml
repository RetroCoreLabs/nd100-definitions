instruction:
  name: SBIT
  description: |
    Store the single bit accumulator (K) in a logical memory bit.
    
    (X) points to the start of a bit array
    (A) points to the bit within the array
  format: SBIT
  opcode: "140512"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6253 opcode_sbit_store_bit_accumulator_to_logical_memory - never writes P (nd100x commit 936bf30)"
