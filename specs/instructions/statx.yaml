instruction:
  name: STATX
  description: |
    Store A register
    
    (ea) ⟵ (A)
    
    Store the contents of the A register in the memory location given by the effective address.
  format: STATX <displacement>
  opcode: "143304"  # Octal, Δ denotes 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Memory Transfer Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 135
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2993 opcode_statx_store_a_register_t_x_relative - never writes P (nd100x commit 936bf30)"
