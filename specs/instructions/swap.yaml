instruction:
  name: "SWAP"
  description: |
    Register swap
    
    dr ⟵ sr
  detailed_description: |
    Optional sub-instructions:

    - **CLD=1**: Zero is used instead of the destination register as an operand (dr register contents are unchanged).
    - **CM1=1**: The 1's complement of the source register is used as an operand (sr register contents are unchanged).

    ---

    ### Instruction combinations

    SWAP <sr> <dr>           dr ⟵ sr
    SWAP CLD <sr> <dr>       dr ⟵ sr; sr ⟵ 0
    SWAP CM1 <sr> <dr>       dr ⟵ sr; sr ⟵ dr
    SWAP CM1 CLD <sr> <dr>   dr ⟵ sr; sr ⟵ 0
  opcode: "144000"  # Octal
  mask: "1111_1111_1100_0000"  # Top 10 bits are opcode
  format: "SWAP <sub-instruction(s)> <source> <destination>"
  category: "Register Instructions"
  instruction_class: "register_logical"
  privilege: "user"
  flags_affected: ["C", "O", "Q"]
  examples:
    - description: "Exchange A and D register contents."
      code: "SWAP SA DD"
    - description: |
        Use zero as the destination operand. Exchange the A and X register contents. A register contents are zero, X register contents are the previous contents of A.
      code: "SWAP CLD SA DX"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "neither register field is P"
    - target: "result"
      when: "taken"
      condition: "the destination or the source register field is P (2); SWAP writes both"
      note: "P is loaded with the result; reading P as a source gives the address of the next word"
  exits_source: "nd100x src/cpu/cpu_instr.c:1142 regop - SWAP writes both sr and dr in regop_logical() (nd100x commit 936bf30)"
