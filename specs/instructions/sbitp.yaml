instruction:
  name: SBITP
  description: |
    Store the single bit accumulator (K) in a physical memory bit.
    
    (T) points to the bank number containing the bit array
    (X) points to the start of a bit array
    (A) points to the bit within the array

  detailed_description: |
    Store the single bit accumulator (K) in a bit in physical memory.

        (T) holds the number of the memory bank that holds the bit array
        (X) points to the start of the bit array
        (A) points to the bit within the array

    Format: SBITP      Octal code: 140513

    Privileged instruction.

  format: SBITP
  opcode: "140513"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 144
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6299 opcode_sbitp_store_bit_accumulator_to_physical_memory - never writes P (nd100x commit 936bf30)"
