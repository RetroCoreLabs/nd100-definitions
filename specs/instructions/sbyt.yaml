instruction:
  name: "SBYT"
  description: |
    Store byte from A register to memory
    Addressing: EL = (T) + (X)/2
    - If least significant bit of X = 1: Store right byte
    - If least significant bit of X = 0: Store left byte

    The contents of T point to the beginning of a character string and the contents of X to a byte within the string.

  detailed_description: |
    Store byte.

    The byte in bits 0-7 of the A register is stored in one half of the memory
    location addressed by the T and X registers. The other half of that
    location is not changed.

    Byte addressing uses the T and X registers: T points to the start of a
    character string and X to a byte within the string.

    Format: SBYT      Octal code: 142600

  opcode: "142600"  # Octal
  mask: "1111_1111_1111_1111"  # Standard mask format
  format: "SBYT"
  category: "Single Byte Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 91
  instruction_class: 
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3909 opcode_sbyt_store_byte_from_a_register - never writes P (nd100x commit 936bf30)"
