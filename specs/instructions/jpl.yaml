instruction:
  name: "JPL"
  format: "JPL <address mode> <displacement>"
  opcode: "134000"  # Octal <<
  description: |
    Jump if Plus - Jump to specified address if the result of the last operation was positive (sign bit is 0)
    
    The contents of the program counter are transferred to the L register and the next instruction is taken from the effective address of the JPL instruction.
    Note that the L register points to the instruction after the jump(the program counter incremented before transfer to the L register).	

  category: "Jump Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 78
  privilege: "user"
  flags_affected: []  # JMP doesn't affect any flags
  instruction_class: "memory_transfer"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - target: "effective_address"
      when: "always"
      note: "L is set to the next word first, except in addressing mode 5 (,X ,B)"
  exits_source: "nd100x src/cpu/cpu_instr.c:4284 opcode_jpl_jump_if_last_result_positive - line 4312 (nd100x commit 936bf30)"
