instruction:
  name: "STZ"
  description: |
    Store zero to memory location
    (EA) ⟵ 0

    Store the value zero in the memory location pointed to by the effective address.
  opcode: "000000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "STZ <addressing_mode> <displacement>"
  category: "Memory Transfer: Store"
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2710 opcode_stz_store_zero - never writes P (nd100x commit 936bf30)"
