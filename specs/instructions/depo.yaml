instruction:
  name: DEPO
  description: |
    Deposit
    
    Store the contents of the T register in the physical memory location pointed to by the A and D register contents.

  detailed_description: |
    Memory deposit.

    Privileged. Only available to programs running in system mode (rings 2-3) or without memory protection.

    The contents of the T register are stored in the physical memory location addressed by the A and D registers.

    Format: DEPO

    If a memory error occurs during a DEPO, bit 15 (Fetch) of the PES register (memory error status, read with TRA PES) is set.

  format: DEPO
  opcode: "150417"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Physical Memory Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 130
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6908 opcode_depo_deposit_memory - never writes P (nd100x commit 936bf30)"
