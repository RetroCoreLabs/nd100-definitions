instruction:
  name: DEPO
  description: |
    Deposit
    
    Store the contents of the T register in the physical memory location pointed to by the A and D register contents.
  format: DEPO
  opcode: "150417"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Physical Memory Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6908 opcode_depo_deposit_memory - never writes P (nd100x commit 936bf30)"
