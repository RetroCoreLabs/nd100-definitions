instruction:
  name: COMD
  description: |
    Compare two decimal operands.
    
    (A) ⟵ (op1) compared to (op2)
    
    (A) =  0   if (op1) = (op2)
    (A) =  1   if (op1) > (op2)
    (A) = -1   if (op1) < (op2)
    
    Compare the first operand with the second operand, leaving the result in the A register.
    
    If the two operands are unequal in field length, the shorter operand is extended with zeros to allow comparison. The operands are unaffected by the instruction.
    
    The positions of the decimal points are not taken into account when the two operands are compared, so the two operands should be normalized using the SHDE instruction first.
    
    Any empty operand, that is with a field length of zero, is treated as a positive zero. An unsigned number is treated as positive. Positive and negative zeros are equal.
    
    **Instruction sequence:**
    
        COMD
        error handling instruction
        next instruction after COMD or after error handling routine
    
    **Example:**
    
        COMD
        JMP *30₈
        AAA 20₈
    
    The COMD instruction causes the program counter to skip the next instruction UNLESS an error has been generated. In this case, the instruction immediately after COMD will handle the error in some way (in this example a jump is executed on error to ((P) + 30₈)).
    
    (* is the assembler mnemonic for the P register)

  detailed_description: |
    Compare decimal.

        (A) <- (op1) compared to (op2)

        (A) =  0   if (op1) = (op2)
        (A) =  1   if (op1) > (op2)
        (A) = -1   if (op1) < (op2)

    The first operand is compared with the second, and the result is placed in the A register. Neither operand is changed.

    Decimal operands must be right adjusted, so that the least significant digit and the sign are in the last byte of the operand field. Each operand is given by a two-word descriptor: the first operand in the A and D registers, the second operand in the X and T registers. The operands are read into the register file before the operation, and the result is written back to memory.

    If the operands differ in length, the shorter one is extended with zeros. The positions of the decimal points are not taken into account, so the operands must be aligned first, as for ADDD/SUBD, with SHDE.

    An empty operand (field length 0) is treated as a positive zero. An unsigned number is treated as positive. Positive and negative zero are equal.

    Format: COMD

    Skip behaviour: the ND-100 manual says COMD always gives a skip return (no error condition). The ND-110 manual shows the usual decimal sequence, with an error return after COMD that is skipped unless an error occurs:

        COMD
        JMP *30       error return
        AAA 20        normal return

    (* is the assembler mnemonic for the P register.)

  opcode: "0140122" # Octal
  format: "COMD"
  mask: "1111_1111_1111_1111"
  category: "Decimal Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 102
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "error"
      condition: "an operand descriptor is bad (the compare itself has no error case)"
    - offset: 2
      when: "ok"
  exits_source: "nd100x src/cpu/bcd.c:808 opcode_comd_compare_two_decimal_operands - every early return leaves P at the next word; skip (gPC++) at line 843 (nd100x commit 936bf30)"
