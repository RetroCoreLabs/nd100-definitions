instruction:
  name: REMPL
  description: |
    Remove page from page list.

    A SINTRAN III instruction of the ND-110 microprogram. It takes the core map table entry addressed by X out of the page list it is on: the entries before and after it are linked to each other, and words 0 and 1 of the removed entry are cleared. INSPL does the opposite.

    Source: the ND-110 Instruction Set manual, ND-06.029.1, page 142, and its PLANC listing in Appendix B (page 169). The OCR of that listing is damaged in places, so only the shape of the operation is given here.

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Remove page from page list. The manual describes it in software (PLANC) form in Appendix B. The transcription of that listing is damaged in places; it is given here exactly as transcribed:

        R1 := (cmbnk,X).0
        R2 := (cmbnk,X).1
        IF R2∧3 = 0 THEN
            R1 := (cmbnk,R2).0
        ELSE
            Q := (R2 * 2) + ststr
            R1 := (stbnk,Q).7
        ENDIF
        IF R1≠0 THEN
            R2 := (cmbnk,R1).1
        ENDIF
        O := (cmbnk,X).0
        O := (cmbnk,X).1

  format: REMPL
  opcode: "140503"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 142
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5818 opcode_rempl_remove_page_from_page_list - never writes P (nd100x commit 936bf30)"
