instruction:
  name: "AAT"
  description: "Add argument to T"
  opcode: "173000"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "AAT <number>"
  category: "Argument Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 85
  privilege: "user"
  operands:
    - name: "opcode"        
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  flags_affected:
    - C  # Carry
    - O  # Overflow
  examples:
    - description: "Add 13 to the contents of the T register."
      code: "AAT 13"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2495 opcode_aat_add_argument_to_t - never writes P (nd100x commit 936bf30)"
