instruction:
  name: LBIT
  description: |
    Load single bit accumulator (K) with logical memory bit.
    
    (X) points to the start of a bit array
    (A) points to the bit within the array
  format: LBIT
  opcode: "140510"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6173 opcode_lbit_load_bit_accumulator_from_logical_memory - never writes P (nd100x commit 936bf30)"
