instruction:
  name: "ENTR"
  description: |
    Enter stack.
    
    This instruction saves the current stack pointer (B), the return address (LINK), and previous stack pointer (PREVB). It transfers the top of stack address (SMAX) and establishes the new stack demand and pointer.
    
      (B = 177₈) ⟵ (B)                {save current pointer in PREVB}
      (B = 175₈) ⟵ (B = 175₈)         {SMAX}
      (B = 200₈) ⟵ (L) + 1            {save return address in LINK}
      (B)        ⟵ (B = 176₈) + 200₈   {new pointer}
      (B = 176₈) ⟵ stack demand + (B)
    
    Stack overflow causes an error return, that is the program continues at the address following the stack demand value. In all other cases, the program skips this address to find the return address from the stack.
    
    Format:
      ENTR 
      <stack demand-value in words>
      <error return address>
      <return address>
      
  detailed_description: |
    Enter stack.

        (B - 176) + 200       => B          (new pointer)
        L + 1                 => B - 200    (LINK, return address)
        old B                 => B - 177    (PREVB)
        (old B - 175)         => B - 175    (SMAX)
        stack demand + B      => B - 176    (STP)

    This saves the current stack pointer (B) as PREVB and the return address in LINK, copies the top of stack address (SMAX), and sets up the new stack pointer and the stack demand.

    Format:

        ENTR
        <stack demand, in words>
        <error return>
        <normal return>

    On stack overflow the program continues at the error return (the word after the stack demand). In all other cases that word is skipped and the program continues at the normal return.

    The B register always points to a stack frame holding:

        B - 200   LINK    next instruction address (used by LEAVE)
        B - 177   PREVB   previous stack frame address
        B - 176   STP     next stack frame address
        B - 175   SMAX    top of stack address (used to find stack overflow)
        B - 174   reserved for system use
        B - 173   ERRCODE filled with (A) each time ELEAV is executed

    The ND-110 manual says the stack instructions are page-fault tolerant on the ND-110. The ND-100 manual warns that a page fault during a stack instruction can destroy the B register, so on the ND-100 the stack instructions must not be used where page faults can occur.

  opcode: "0140135" # Octal
  format: "ENTR"
  mask: "1111_1111_1111_1111"
  category: "Stack Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 109
  instruction_class:
  privilege: "user"
  flags_affected:
    - PTM # "Page Table Flag - Status register bit 0 used for flag comparison"

  # Where execution continues after this instruction (see schema field 'exits').
  inline_words: 1
  exits:
    - offset: 2
      when: "error"
      condition: "stack overflow"
    - offset: 3
      when: "ok"
  exits_source: "nd100x src/cpu/cpu_instr.c:4443 opcode_entr_enter_stack - stack demand read at P+0, error gPC += 1 at line 4451, ok gPC += 2 at line 4461 (nd100x commit 936bf30)"
