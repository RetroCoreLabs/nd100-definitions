instruction:
  name: MOVEW
  description: |
    Word block move.
    
    This instruction moves a block of words from one area of memory to another. The type of transfer is determined by the opcode field ΔΔ, with the base octal code 1431ΔΔ.

      <ascii-table>
      ┌───────┬─────────────┬─────────────┐
      │ ΔΔ₈   │ move from:  │ move to:    │
      ├───────┼─────────────┼─────────────┤
      │ 00₈   │ PT          │ PT          │
      │ 01₈   │ PT          │ APT         │
      │ 02₈   │ PT          │ phy.memory* │
      │ 03₈   │ APT         │ PT          │
      │ 04₈   │ APT         │ APT         │
      │ 05₈   │ APT         │ phy.memory* │
      │ 06₈   │ phy.memory  │ PT*         │
      │ 07₈   │ phy.memory  │ APT*        │
      │ 10₈   │ phy.memory  │ phy.memory* │
      └───────┴─────────────┴─────────────┘
      </ascii-table> 

      * = privileged instruction
      PT  = normal page table
      APT = alternative page table
      phy.memory = physical memory

    The following registers control the transfer:
    - A and D: source address
    - X and T: destination address
    - L: number of words to be moved (maximum 2048 words)
    
    For physical memory-block moves, A and/or X are incremented when D and/or T overflow.
    
    If the L register contains a value greater than 2048 (L = 4000₈), no words are moved and A, D, T, and X remain unchanged.
    
    After transfer, the registers contain:
    - A, D, T, X: addresses after the last moved word
    - L: zero
    
    Special cases:
    If the memory management system is off (bit PTM of the STS register is zero), bank 0 of physical memory is addressed and the following transfer fields become equivalent:
    - ΔΔ = 00 = 01 = 03 = 04
    - ΔΔ = 02 = 05
    - ΔΔ = 06 = 07
    
    MOVEW can be interrupted. L, A, D, X, T, and P registers are then changed to restart execution.

  detailed_description: |
    Move a block of words from one area of memory to another. The base octal code is 1431ΔΔ; the field ΔΔ chooses where the words are read and written:

        ΔΔ    move from      move to
        00₈   PT             PT
        01₈   PT             APT
        02₈   PT             phys. memory *
        03₈   APT            PT
        04₈   APT            APT
        05₈   APT            phys. memory *
        06₈   phys. memory   PT
        07₈   phys. memory   APT *
        10₈   phys. memory   phys. memory *

        PT  = normal page table
        APT = alternative page table
        *   = privileged

    The manual's table does not mark 06 (physical memory to PT) as privileged, although every
    other code that touches physical memory is. The nd100x emulator (do_movew) checks privilege
    for 06 as well; this has not been tested on a real machine.

    Registers that control the move:

        A and D   source address
        X and T   destination address
        L         number of words to move (maximum 2048)

    For moves to or from physical memory, only A and/or X are used, and they are incremented when D and/or T overflow.

    If L holds a value greater than 2048 (L = 4000₈), no words are moved and A, D, T and X are unchanged.

    After the move, A, D, T and X hold the addresses after the last moved word, and L is zero.

    If memory management is off (bit PTM of the STS register is zero), bank 0 of physical memory is addressed, and these codes do the same thing:

        ΔΔ = 00 = 01 = 03 = 04
        ΔΔ = 02 = 05
        ΔΔ = 06 = 07

    MOVEW can be interrupted. The L, A, D, X, T and P registers are then changed so that execution restarts.

  opcode: "0143100" # Octal, ΔΔ specifies the transfer type
  format: "MOVEW"
  mask: "1111_1111_1111_1000" # 
  category: "Word Block Instruction"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 95
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1993 do_movew - never writes P (nd100x commit 936bf30)"
