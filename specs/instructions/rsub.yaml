instruction:
  name: "RSUB"
  description: |
    Register subtract
    
    dr ⟵ dr - sr
    
    RSUB is a compound mnemonic for RADD AD1 CM1 (or RADD CM2 using the AD1 CM2 compound mnemonic).

  detailed_description: |
    The following sub-instruction is allowed:

    - **CLD**

    Note:
    Sometimes the RADD form will be more readable.

  opcode: "146600"  # Octal
  mask: "1111_1111_1100_0000"  # Top 10 bits are opcode
  format: "RSUB <sub-instruction> <source> <destination>"
  category: "Register Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 57
  instruction_class: "register_arithmetic"
  privilege: "user"
  isalias: true
  flags_affected: ["C", "O", "Q"]
  examples:
    - description: "Subtract the contents of the T register from the contents of the B register leaving the result in B."
      code: "RSUB ST DB"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the destination register is not P"
    - target: "result"
      when: "taken"
      condition: "the destination register field is P (2)"
      note: "P is loaded with the result; reading P as a source gives the address of the next word"
  exits_source: "nd100x src/cpu/cpu_instr.c:1142 regop - register write in regop_logical()/regop_arith() (nd100x commit 936bf30)"
