instruction:
  name: "COPY"
  description: |
    Copy source to destination

    COPY is a compound mnemonic for RADD CLD.

    Optional subinstructions:
    The following sub-instructions are allowed:
      CM1, CM2, ADC, AD1

    Note:
    Using ADC and AD1i in the same instruction generates a no-operation.


  opcode: "0146100"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 is the opcode.
  format: "COPY [sub-instruction(s)] <source> <destination>"
  category: "Register Instructions"
  instruction_class: "register_src_dst"
  flags_affected: ["C", "O", "Q"]
  privilege: "user"
  isalias: true
  examples:
    - description: "Copy the contents of the A register to the D register."
      code: "COPY SA DD"
    - description: "2's complement the A register. (Equivalent to RADD CM1 ADC SA DA"
      code: "COPY CM2 SA DA"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the destination register is not P"
    - target: "result"
      when: "taken"
      condition: "the destination register field is P (2)"
      note: "P is loaded with the result; reading P as a source gives the address of the next word"
  exits_source: "nd100x src/cpu/cpu_instr.c:1142 regop - register write in regop_logical()/regop_arith() (nd100x commit 936bf30)"
