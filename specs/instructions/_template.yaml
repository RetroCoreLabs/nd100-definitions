instruction:
  name: "INSTRUCTION_NAME"          # e.g., "ADD", "SUB", "AND"  
  description: "Detailed description of what the instruction does"
  opcode: "0150000"                 # Octal opcode
  mask: "1111_1000_0000_0000"       # top 5 bits are opcode  (may be omitted if instruction_class is defined, is it will be inherited from the instruction_class)
  category: "Register Transfer Instructions"  # must be a name in specs/categories.yaml
  manual_refs:                      # where the manuals describe it; manual ids: cpu.yaml metadata.manuals
    - manual: "ND-06.029.1"
      page: 119                     # the printed page number
  privilege: "user"                 # user or privileged (The privileged instructions are used by the operating system and RT programs only.)    
  instruction_class: "CLASS_NAME"   # Must be a valid class defined in the cpu.yaml file under "instruction_classes" Using this to determine the bit format, hence no "operands" are needed below.
  
  operands:
    - name: "opcode"
      type: "uint5"
      description: "Opcode"      
      bits: 15-11      
    - name: "mode"
      type: "addressing_mode"
      description: "Memory addressing mode"      
      bits: 10-8
    - name: "disp"
      type: "displacement"
      description: "Memory address displacement"      
      bits: 7-0

  format: "INSTRUCTION_NAME operand1, operand2"  # Assembly format    

  flags_affected:  # can be any bits from STS register defined in cpu.yaml
    - "C"  # Carry flag
    - "O"  # Overflow flag
    - "Q"  # Sign flag
    - "Z"  # Zero flag

  # Where execution continues afterwards. Required for every instruction.
  # offset = words from the instruction's own address (1 = next word, 2 = skip one word).
  # For a non-fixed exit use target: (effective_address, displacement, result, register,
  # stack_link, stack_link_minus_1, executed_instruction) instead of offset.
  # when: always | ok | error | taken | not_taken. See specs/schema/instruction_schema.yaml.
  inline_words: 0                   # data words after the instruction word (e.g. 1 for ENTR); omit when 0
  exits:
    - offset: 1
      when: "error"
      condition: "plain words: what makes the error return happen"
    - offset: 2
      when: "ok"
  exits_source: "nd100x src/cpu/<file>:<line> <function> - what the code does (nd100x commit <hash>)"

  
  
  
      
  