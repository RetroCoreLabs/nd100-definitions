instruction:
  name: SZCB
  description: |
    Store zero in the core map-table bank (CMBNK).
    
    (ea) <--- 0
    
    ea = (B) + Δ = CMBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)  

  detailed_description: |
    Store zero in the core map table bank (CMBNK).

        (ea) <- 0
        ea = (B) + displacement = CMBNK entry

    ea is (B) plus a 3-bit displacement that is part of the instruction code
    (bits 5-3, shown as the ? digit in the octal code 1407?7).

    Privileged instruction.

  format: SZCB <displacement>
  opcode: "140707"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 145
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6691 opcode_szcb_store_zero_in_core_map_bank - never writes P (nd100x commit 936bf30)"
