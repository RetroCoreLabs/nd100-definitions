instruction:
  name: PON
  description: |
    Memory management ON

    Enable memory management system. The next instruction after PON will then use the pageindex table specified by PCR.
    BEFORE USE ENSURE:
      - Interrupt system is enabled,
      - Internal hardware interrupts are enabled,
      - Page tables and PCR registers are initialized.

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Memory management on. The memory management system is turned on, and the instruction after PON uses the page index table given by the PCR register.

    Before use, make sure that:

    - the interrupt system is on,
    - internal hardware interrupts are enabled,
    - the page tables and the PCR registers are set up.

  opcode: "150410"  # Octal
  mask: "1111_1111_1111_1111" # top 16 bits are opcode
  format: "PON"    
  category: "Memory Management Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 128
  instruction_class:
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5099 opcode_pon_paging_on - never writes P (nd100x commit 936bf30)"
