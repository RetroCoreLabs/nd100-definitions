instruction:
  name: "IRW"
  description: |
    Inter Register Write
    Write A to specified register on specified level
    
  opcode: "153400"  # Octal
  mask: "1111_1111_1000_0000"  # Matches bit pattern 1 1 0 1 0 1 1 1 from image
  format: "IRW <level> <register>"
  category: "Inter-level Register Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 114
  instruction_class: 
  privilege: "privileged"
  
  operands:
    - name: "opcode"
      type: "opcode"
      bits: "15-7"
      description: "The opcode for inter-register read"
    
    - name: "level"
      bits: "6-3"
      type: "uint4"
      description: "Privilege level to access (0-15)"
    
    - name: "register"
      bits: "2-0"
      type: "enum"
      description: "Register to read from specified level"
      enum:
        - name: "STS" # OR blank or
          value: "000000"
          description: "Status register"
        - name: "DD"
          value: "000001"
          description: "D register"
        - name: "DP"
          value: "000002"
          description: "P register"
        - name: "DB"
          value: "000003"
          description: "B register"
        - name: "DL"
          value: "000004"
          description: "L register"
        - name: "DA"
          value: "000005"
          description: "A register"
        - name: "DT"
          value: "000006"
          description: "T register"
        - name: "DX"
          value: "000007"
          description: "X register" 

  examples:
    - name: "IRW 100 DB"
      description: "Copy the A register on the current program level into the B register on program level 8"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:4845 opcode_irw_inter_register_write - never writes P of the current level; IRW to P on the current level does nothing (line 4860) (nd100x commit 936bf30)"
