instruction:
  name: LBITP
  description: |
    Load single bit accumulator (K) with physical memory bit.
    
    (T) points to the bank number containing the bit array
    (X) points to the start of a bit array
    (A) points to the bit within the array

  detailed_description: |
    Load the single bit accumulator (K) with a bit from physical memory.

        (T) holds the bank number containing the bit array
        (X) points to the start of the bit array
        (A) points to the bit within the array

    Privileged instruction (SINTRAN III control instruction).
  format: LBITP
  opcode: "140511"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 141
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6211 opcode_lbitp_load_bit_accumulator_from_physical_memory - never writes P (nd100x commit 936bf30)"
