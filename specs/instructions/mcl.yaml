instruction:
  name: MCL
  description: |
    Masked clear
    
    The A register is used as a mask to clear bits within the selected internal register.
    Setting a bit in the A register clears the corresponding bit in the internal register.
    
    See table for internal registers that allow MCL.
  
  opcode: "0150200"  # Octal  
  format: "MCL <internal_register>"  
  category: "Register Transfer Instructions"
  instruction_class: # "register_transfer" 
  privilege: "privileged" 
  mask: "1111_1111_1111_0000" # top 12 bits are opcode
  operands:
    - name: "opcode"        
      bits: "15-4"
      type: "opcode"
      description: "The opcode determines what type of operation occurs"
    - name: "internal_register"
      type: "enum"
      bits: "3-0"
      description: "The CPU internal register"               
      enum: # values are OCTAL
        - name: "STS"
          value: "0001"
        - name: "PID"
          value: "0006"
        - name: "PIE"
          value: "0007"
  examples:
    - description: |
        MCL STS (150201₈)   [ (A) = 000100₈ ]
        
        Clear the carry flag (bit 6) in the status (STS) register.
      code: "MCL STS"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1195 do_mcl - never writes P (nd100x commit 936bf30)"
