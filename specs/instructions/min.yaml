instruction:
  name: "MIN"
  description: |
    Memory increment and skip next instruction if zero (EA): = (EA) + 1
    
    (ea) ⟵ (ea) + 1
    (P)  ⟵ (P) + 2 IF new (ea) = 0

    The contents of the memory location pointed to by the effective address are incremented by one. 
    If the new memory location when incremented becomes zero, the next instruction is skipped.

  opcode: "040000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "MIN <addressing_mode> <displacement>"
  category: "Memory Transfer - Store Instruction"
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the incremented memory word is not zero"
    - offset: 2
      when: "taken"
      condition: "the incremented memory word is zero"
  exits_source: "nd100x src/cpu/cpu_instr.c:2832 opcode_min_memory_increment_and_skip_if_zero - line 2842 (nd100x commit 936bf30)"
