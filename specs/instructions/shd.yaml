instruction:
  name: "SHD"
  description: 
    Shift D register

    Every shift instruction places the last bit discarded in the multi-shift flag (M). 
    M can be used as an inputfor the next shift instruction. M is bit 8 of the STS Register.
  opcode: "154200"  # Octal
  mask: "1111_1001_1000_0000" # top 5 bit are the opcode and bit 8-7 are register, part of decoding
  format: "SHD <shift_type> <shift_counter>"
  category: "Shift Instructions"
  instruction_class: "shift_instructions"
  privilege: "user"
  flags_affected:
    - M

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3971 opcode_shift_group - never writes P (nd100x commit 936bf30)"
