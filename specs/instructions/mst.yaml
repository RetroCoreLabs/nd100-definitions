instruction:
  name: MST
  description: |
    Masked set
    
    The A register is used as a mask to set bits within the selected internal register.
    Setting a bit in the A register sets the corresponding bit in the internal register.
    
    See table for internal registers that allow MST.

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Masked set. The A register is used as a mask: every bit that is set in A sets the same bit in the selected internal register. The register number is in bits 3-0 of the instruction.

    Internal registers that allow MCL and MST:

        STS   status                       1₈
        PID   priority interrupt detect    6₈
        PIE   priority interrupt enable    7₈
        CS    control store (ND-110 only)  17₈

    Example:

        MST PIE (150307₈) with (A) = 000140₈

    sets bits 5 and 6 in the priority interrupt enable register (PIE).

  opcode: "0150300"  # Octal  
  format: "MST <register>"  
  category: "Register Transfer Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 118
  instruction_class: #"register_transfer" 
  privilege: "privileged"
  mask: "1111_1111_1111_0000" # top 12 bits are opcode
  bit_format: |
        +----------------------------+---------+
        | 15 -------------------- 4  | 3 --- 0 |
        +----------------------------+---------+
        | OpCode                     | Register|
        +----------------------------+---------+
  operands:
    - name: "opcode"        
      bits: "15-4"
      type: "opcode"
      description: "The opcode determines what type of operation occurs"
    - name: "internal_register"
      type: "enum"
      bits: "3-0"
      description: "The CPU internal register"               
      enum: # values are OCTAL
        - name: "STS"
          value: "0001"
        - name: "PID"
          value: "0006"
        - name: "PIE"
          value: "0007"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1234 do_mst - never writes P (nd100x commit 936bf30)"
