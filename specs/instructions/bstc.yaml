instruction:
  name: BSTC
  description: |
    Store complement and set

    bit ⟵ NOT K, K ⟵ 1

    Bit <bn> of register <dr> gets the complement of K, then K is set to 1.

    Source: ND-06.014 (ND-100 Reference Manual) section 3.2.2.6.3, One Bit Accumulator Instructions. K is the one-bit accumulator in the status register STS; <bn> is the bit number and <dr> the register.

  opcode: "176000"  # Octal
  mask: "1111_1111_1000_0000" # top 9 bits are opcode
  format: "BSTC <bn> <dr>"
  category: "Bit Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 87
  privilege: "user"
  flags_affected:
    - K  # 1-bit accumulator (K)

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the register field is not P"
    - target: "result"
      when: "taken"
      condition: "the register field is P (2): a bit of P is changed and execution continues at the changed P"
  exits_source: "nd100x src/cpu/cpu_instr.c:1701 do_bops - cpu_setbit(dr, ...) writes the named register, which may be P (nd100x commit 936bf30)"
