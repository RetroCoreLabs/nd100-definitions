instruction:
  name: "AAX"
  description: "Add argument to X"
  opcode: "173400"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "AAX <number>"
  category: "Argument Instructions"
  privilege: "user"
  operands:
    - name: "opcode"        
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  flags_affected:
    - C  # Carry
    - O  # Overflow
  examples:
    - description: "Add 5 to the contents of the X register."
      code: "AAX 5"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2520 opcode_aax_add_argument_to_x - never writes P (nd100x commit 936bf30)"
