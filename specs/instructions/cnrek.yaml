instruction:
  name: CNREK
  description: |
    Clear non-reentrant pages (SINTRAN K only).

    A SINTRAN III instruction of the ND-110 microprogram, used by SINTRAN K only. For every bit that is set in a bitmap of words addressed by T and X, it clears the matching page table entry. CLNREENT is the same operation for other SINTRAN versions.

    Source: the ND-110 Instruction Set manual, ND-06.029.1, page 139, and its PLANC listing in Appendix B (page 168). The OCR of that listing is damaged in places, so only the shape of the loop is given here.

  detailed_description: |
    Clear non reentrant pages (SINTRAN K only).

    Privileged. Only available to programs running in system mode (rings 2-3) or without memory protection.

    The ND-110 manual gives only this one-line description and a PLANC listing in Appendix B (page 168). From that listing: a page table entry is cleared for each bit that is set in a bitmap of words read through T and X.

    Format: CNREK

  format: CNREK
  opcode: "140504"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 139
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5896 opcode_cnrek_clear_non_reentrant_pages_sintran_k - never writes P (nd100x commit 936bf30)"
