instruction:
  name: LDXTX
  description: |
    Load X register
    
    (X) ⟵ (ea)
    
    Load the contents of the physical memory location pointed to by the effective address into the X register.
  format: LDXTX <displacement>
  opcode: "143301"  # Octal, Δ denotes 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Memory Transfer Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2896 opcode_ldxtx_load_x_register_t_x_relative - never writes P (nd100x commit 936bf30)"
