instruction:
  name: CLNREENT
  description: |
    Clear non reentrant pages.
    
    The contents of the memory address at A + 2 are read to find the page table to be cleared along with the SINTRAN RT bitmap (addressed by the X and T registers). 
    The page table entries corresponding to those bits set in the RT bitmap are then cleared.

  detailed_description: |
    Clear non reentrant pages.

    Privileged. Only available to programs running in system mode (rings 2-3) or without memory protection.

    The contents of the memory address at A + 2 are read to find the page table to be cleared, together with the SINTRAN RT bitmap, which is addressed by the X and T registers. The page table entries that match the bits set in the RT bitmap are then cleared.

    Format: CLNREENT

  format: CLNREENT
  opcode: "140302"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 139
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5354 opcode_clnreent_clear_non_reentrant_pages - never writes P (nd100x commit 936bf30)"
