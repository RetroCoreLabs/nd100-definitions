instruction:
  name: "LDA"
  description: |
    Load A register
    
    Load the contents of the memory location pointed to by the effective address into the A register.

  opcode: "044000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "LDA <addressing_mode> <disp>"  
  category: "Memory Transfer - Load Instruction"
  instruction_class: "memory_transfer" 
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2620 opcode_lda_load_a_register - never writes P (nd100x commit 936bf30)"
