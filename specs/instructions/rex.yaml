instruction:
  name: REX
  description: |
    Reset extended address mode

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Reset extended address mode. The paging system goes from 24-bit addresses back to 19-bit addresses, which gives a physical address space of up to 512K words.

    Flag: SEXI (bit 13 of the STS register) is cleared, which shows normal address mode.

    SEX does the opposite.

  extended_description: |
    Set the paging system to the 19-bit address mode instead of the 24-bit address mode.
    (Creating a physical address space of up to 512K words.)
    
  format: REX
  opcode: "0150407"  # Octal (example, update if needed)
  mask: "1111_1111_1111_1111"
  category: "Memory Management Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 129
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5068 opcode_rex_reset_extended_address_mode - never writes P (nd100x commit 936bf30)"
