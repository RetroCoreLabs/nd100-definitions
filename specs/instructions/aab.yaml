instruction:
  name: "AAB"
  description: "Add argument to B"

  detailed_description: |
    Add argument to the B register.

        (B) <- (B) + argument

    Argument instructions work on registers. The low 8 bits of the instruction hold the argument, a signed number from -128 to 127 (negative numbers in 2's complement). The 8-bit argument is extended to 16 bits by sign extension: it stays as the low byte, and the high byte is filled with zeros when the number is positive and with ones when it is negative. For an add argument instruction, all 16 bits are added to the 16 bits already in the register.

    Format: AAB <number>

  opcode: "172000"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "AAB <number>"
  category: "Argument Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 85
  privilege: "user"
  operands:
    - name: "opcode"        
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  flags_affected:
    - C  # Carry
    - O  # Overflow
  examples:
    - description: "Add -26 to the contents of the B register."
      code: "AAB -26"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2445 opcode_aab_add_argument_to_b - never writes P (nd100x commit 936bf30)"
