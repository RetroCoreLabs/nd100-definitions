instruction:
  name: PIOF
  description: |
    Memory management and interrupt system OFF
    
    Disables both the memory management and interrupt systems. This combines the functions of the IOF and POF instructions.

    Before_use:
      Check conditions of the IOF instruction.

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Turns off both the memory management system and the interrupt system. It does the work of IOF and POF together.

    Before use, check the conditions of the IOF instruction. On IOF the CPU continues at the same program level, the PVL register is unchanged, and the ION display on the panel is reset.

    POF: the next instruction is taken from the physical address that follows the POF instruction. The CPU is then in an unrestricted mode without hardware protection: all instructions are legal and all memory can be reached.

  format: PIOF
  opcode: "150405"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Interrupt Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 126
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:5014 opcode_piof_paging_and_interrupt_off - never writes P (nd100x commit 936bf30)"
