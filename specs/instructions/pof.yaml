instruction:
  name: POF
  description: |
    Memory management OFF
    
    Disable memory management system. The next instruction will be taken from a physical address given by the address following the POF instruction.
    Note: The CPU will be in an unrestricted mode without any hardware protection features - all instructions are legal and all memory accessible.

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Memory management off. The memory management system is turned off, and the next instruction is taken from the physical address that follows the POF instruction.

    Note: the CPU is then in an unrestricted mode without any hardware protection. All instructions are legal and all memory can be reached.

  opcode: "150404"  # Octal
  mask: "1111_1111_1111_1111" # top 16 bits are opcode
  format: "POF"    
  category: "Memory Management Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 128
  instruction_class:
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:4811 opcode_pof_paging_off - never writes P (nd100x commit 936bf30)"
