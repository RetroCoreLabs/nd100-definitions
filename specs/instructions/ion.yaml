instruction:
  name: ION
  description: |
    Interrupt System ON
    
    Enables the interrupt system. On ION the ND-i10 resumes operation in the program level with highest priority.
  opcode: "150402"  # Octal
  mask: "1111_1111_1111_1111" # top 16 bits are opcode
  format: "ION"    
  category: "Interrupt Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 126
  instruction_class:
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:4783 opcode_ion_interrupt_on - never writes P (nd100x commit 936bf30)"
