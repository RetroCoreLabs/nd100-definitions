instruction:
  name: MOVBF
  description: |
    Move bytes forward.
    
    This instruction moves a block of bytes from the memory location addressed by the source operand to that of the memory location addressed by the destination operand.
    
    After execution, bit 15 of the D and T registers point to the end of the field that has been moved. The field length of the D register (source) equals zero and the T register (destination) field length is equal to the number of bytes moved.

  detailed_description: |
    Move bytes forward. A block of bytes is moved from the memory field given by the source operand to the field given by the destination operand.

    The operands are byte fields in memory, each given by two 16-bit descriptor words. The source descriptor is in the A and D registers, the destination descriptor in the X and T registers. The first word (A or X) is the start address. The second word (D or T) holds:

        bit 15      lr: 0 = the field starts in the left byte, 1 = in the right byte
        bit 14      pt: 0 = normal page table, 1 = alternative page table
        bit 13      must always be zero
        bit 12      can be any value
        bits 11-0   field length, number of bytes (maximum 4095)

    After execution, bit 15 of the D and T registers points to the end of the field that was moved. The field length in D (source) is zero, and the field length in T (destination) equals the number of bytes moved.

  opcode: "0140132" # Octal
  format: "MOVBF"
  mask: "1111_1111_1111_1111"
  category: "Byte Block Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 93
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "error"
      condition: "the destination overlaps the source so that a byte would be overwritten before it is read"
    - offset: 2
      when: "ok"
  exits_source: "nd100x src/cpu/cpu_instr.c:3754 opcode_movbf_move_bytes_forward - skip only when no overlap, line 3837 (nd100x commit 936bf30)"
