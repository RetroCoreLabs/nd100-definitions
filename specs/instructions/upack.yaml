instruction:
  name: UPACK
  description: |
    Convert to ASCII.
    
    (op2) ⟵ (op1) in ASCII format
    
    Convert the first operand from its BCD format to ASCII format, placing the result in the second operand location.
    
    **Conversion process:**
    The instruction carries out the following steps:
    1. Checks the sign and digits of the operand (op1) are encoded as BCD digits. (Illegal codes generate an error code 2.)
    2. Takes each BCD digit as the lower nibble of an equivalent ASCII digit. Sets the upper nibble of the ASCII byte (the zone) to 0011₂.
    3. Converts the BCD sign of the operand to ASCII:

           BCD   ASCII   Sign
           0     53₈     +
           1     55₈     -
        Note: If bit 13 of the descriptor D2 is set then the code 17₈ (BCD unsigned) is used.
    4. Extends the second operand field (op2) with ASCII zeros (60₈) if the result is too small to fill the field. Reports overflow has occurred (error code 3), if the second operand field length is too short to contain the significant digits of the result (the remaining digits are ignored).
    
    **Error code:**
    An error code is placed in bits 0 to 4 of the D register if an illegal code conversion is attempted or if overflow occurs. The first detected error will be reported.
    
        Error code: 2   illegal code†
                    3   overflow
        † bit 15 of both the A and D registers point to the byte containing the illegal code.

  detailed_description: |
    Convert to ASCII (unpack).

        (op2) <- (op1) in ASCII format

    The first operand is converted from BCD to ASCII and the result is placed
    in the second operand location. The steps are:

    1. Check that the sign and digits of op1 are valid BCD codes. An illegal
       code gives error code 2.
    2. Use each BCD digit as the low nibble of an ASCII digit, and set the high
       nibble (the zone) to 0011 (binary).
    3. Convert the BCD sign to ASCII: plus becomes 53 octal, minus becomes
       55 octal. If bit 13 of descriptor D2 is set, the code 17 octal (BCD
       unsigned) is used.
    4. Fill the rest of the op2 field with ASCII zeros (60 octal) if the result
       is too short to fill it. If the op2 field is too short to hold the
       significant digits of the result, overflow is reported (error code 3)
       and the remaining digits are dropped.

    Error codes: an error code is placed in bits 0-4 of the D register if an
    illegal code is found or if overflow occurs. Only the first error found is
    reported.

        2  illegal code (bit 15 of both the A and D registers point to the
           byte that holds the illegal code)
        3  overflow

    Format: UPACK      Octal code: 140125

    The first operand descriptor is held in the A and D registers; the second
    in the X and T registers.

  opcode: "0140125" # Octal
  format: "UPACK"
  mask: "1111_1111_1111_1111"
  category: "Decimal Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 106
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "error"
      condition: "an operand descriptor is bad, or the operation fails (overflow, lost digits or illegal code)"
    - offset: 2
      when: "ok"
  exits_source: "nd100x src/cpu/bcd.c:1451 opcode_unpack_convert_from_decimal - every early return leaves P at the next word; skip (gPC++) at line 1481 (nd100x commit 936bf30)"
