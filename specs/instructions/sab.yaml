instruction:
  name: "SAB"
  description: "Set argument to B"

  detailed_description: |
    Set argument to B.

        (B) <- argument

    The 8-bit argument in bits 7-0 is sign-extended to 16 bits: it becomes the low byte, and the high byte is filled with zeros for a positive argument and with ones for a negative one (the argument is in 2's complement form).

    Example: SAB -26₈ sets B to 177752₈. Bits 15-8 are filled with ones because the argument is negative; bits 7-0 hold the argument in 2's complement form.

  opcode: "170000"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "SAB <number>"
  category: "Argument Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 85
  privilege: "user"
  operands:
    - name: "opcode"        
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  # no flags: the ND-110 manual names none for the set-argument instructions, and nd100x
  # (src/cpu/cpu_instr.c, cpu_setreg) only loads the register
  flags_affected: []
  examples:
    - description: "The contents of the B register are set to 177752, bits 0-7 have been extended with ones as the argument is negative; bits 0-7 have the argument in its 2's complement form."
      code: "SAB -26"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2357 opcode_sab_set_argument_to_b - never writes P (nd100x commit 936bf30)"
