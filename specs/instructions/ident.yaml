instruction:
  name: "IDENT"
  format: " IDENT <level_code>"
  opcode: "0143600"  # Octal format (
  mask: "1111_1111_1100_0000" # top 16 bits are opcode
  description: |
    Transfer IDENT code of interrupting device with highest priority on the specified level to A register. 

  detailed_description: |
    Identify vectored interrupt. Finds and serves the input/output device that caused an interrupt on the given program level. A hardware search is made on that level; the first interrupting device found answers with its identification code and turns off its interrupt.

    Bits 0-8 of the A register are loaded with the identification code; bits 9-15 are cleared. If there is no interrupting device to serve, the A register is unchanged, and an IOX error interrupt to level 14 occurs if that is enabled.

    Vectored interrupts are only allowed on program levels 10 to 13, so there is one IDENT per level:

        IDENT PL10   143604
        IDENT PL11   143611
        IDENT PL12   143622
        IDENT PL13   143643

    IDENT only searches the level it names; interrupts on other levels are left for their own IDENT.

    If several devices on the same level interrupt at the same time, the device in the card slot nearest the CPU has the highest priority and is served first. The PID register bit for that level stays set until all interrupting devices are served.

    Privileged instruction.
  category: "Interrupt Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 125
  privilege: "privileged"
  flags_affected:
  instruction_class:
  operands:
  - name: "opcode"
    type: "opcode"
    bits: "15-6"
    description: "The opcode determines what type of operation occurs" 
  - name: "level_code"
    type: "enum"
    bits: "5-0"
    description: "The interrupt level code"
    enum: # values are OCTAL
        - name: "PL10"
          value: "000004"
          description: "Level 10"
        - name: "PL11"
          value: "000011"
          description: "Level 11"
        - name: "PL12"
          value: "000022"
          description: "Level 12"
        - name: "PL13"
          value: "000043"
          description: "Level 13"       
  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:4677 opcode_ident_identify_interrupting_device - never writes P (nd100x commit 936bf30)"
examples:
    - code: "IDENT PL10"
      description: "Transfer IDENT code of interrupting device with highest priority on level 10 to A register. Used in interrupt handler"
    - code: "IDENT PL11"
      description: "Transfer IDENT code of interrupting device with highest priority on level 11 to A register. Used in interrupt handler"
    - code: "IDENT PL12"
      description: "Transfer IDENT code of interrupting device with highest priority on level 12 to A register. Used in interrupt handler"
    - code: "IDENT PL13"
      description: "Transfer IDENT code of interrupting device with highest priority on level 13 to A register. Used in interrupt handler"
