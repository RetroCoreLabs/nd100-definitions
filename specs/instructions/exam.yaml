instruction:
  name: EXAM
  description: |
    Examine
    
    Load the contents of the physical memory location, pointed to by the A and D register contents, into the T register.

  detailed_description: |
    Memory examine.

    Privileged. Only available to programs running in system mode (rings 2-3) or without memory protection.

    The T register is loaded with the contents of the physical memory location addressed by the A and D registers.

    Format: EXAM

    If a memory error occurs during an EXAM, bit 15 (Fetch) of the PES register (memory error status, read with TRA PES) is set.

  format: EXAM
  opcode: "150416"  # Octal
  mask: "1111_1111_1111_1111"
  category: "Physical Memory Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 130
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6877 opcode_exam_examine_memory - never writes P (nd100x commit 936bf30)"
