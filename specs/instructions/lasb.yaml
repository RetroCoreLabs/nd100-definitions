instruction:
  name: LASB
  description: |
    Load the A register with the contents of the segment-table bank (STBNK).
    
    (A) <--- (ea)
    
    ea = (B) + Δ = STBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)

  detailed_description: |
    Load the A register from the segment table bank (STBNK).

        (A) <- (ea)
        ea = (B) + d = STBNK entry

    d is a 3-bit displacement (bits 3-5 of the instruction) added to B.

    Privileged instruction (SINTRAN III control instruction).
  format: LASB <displacement>
  opcode: "140700"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 140
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6523 opcode_lasb_load_a_from_segment_table_bank - never writes P (nd100x commit 936bf30)"
