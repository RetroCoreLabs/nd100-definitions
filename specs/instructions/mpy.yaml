instruction:
  name: "MPY"
  description: |
    Multiply integer
    A ⟵ A * (EL)

    Multiply the contents of the memory location pointed to by the effective address with the contents of the A register, leaving the result in A.

  detailed_description: |         
    **Flags affected**
      O ⟵ 1; Q ⟵ 1
      If an overflow occurs, that is if the result has an absolute value greater than decimal 32767

  opcode: "120000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "MPY <addressing_mode> <displacement>"
  category: "Arithmetic and Logical"
  instruction_class: "memory_transfer"
  privilege: "user" 
  flags_affected: ["O", "Q"]

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:7279 mpy - never writes P (nd100x commit 936bf30)"
