instruction:
  name: IOF
  description: |
    Interrupt System OFF

    Disables the interrupt system.
    On IOF the ND-110 continues operation at the same program level.
  opcode: "150401"  # Octal
  mask: "1111_1111_1111_1111" # top 16 bits are opcode
  format: "IOF"    
  category: "Interrupt Control Instructions"
  instruction_class:
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:4754 opcode_iof_interrupt_off - never writes P (nd100x commit 936bf30)"
