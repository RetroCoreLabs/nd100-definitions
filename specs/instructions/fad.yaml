instruction:
  name: "FAD"
  description: |        
    Add to floating point accumulator

    (A) ⟵ (ea)     + (T)
    (D) ⟵ (ea + 1) + (A)

    The contents of two sequential memory locations, pointed to by the effective address, are added to the contents of the floating point accumulator (T and A registers). The result is held in the accumulator.

  detailed_description: |
    Add to floating accumulator. The floating point number held in the memory locations pointed to by the effective address is added to the floating accumulator, and the result is left in the floating accumulator.

    The ND-100 Reference Manual describes the operand as the effective location and the two following locations, and the floating accumulator as the T, A and D registers.

    Registers and flags affected: T, A, D and TG.
    

  opcode: "0100000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "FAD <addressing_mode> <disp>"
  category: "Memory Transfer: Arithmetic and Logical"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 68
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3278 opcode_fad_add_to_floating_accumulator - never writes P (nd100x commit 936bf30)"
