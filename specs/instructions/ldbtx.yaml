instruction:
  name: LDBTX
  description: |
    Load B register
    
    (B) ⟵ 177000₈ OR (2(ea))
    
    Load the contents of the physical memory location pointed to by twice the effective address contents into the B register, then OR the value with 177000₈.
    
    See description for usage.

  detailed_description: |
    Load B register from physical memory. The word at the effective address is doubled, ORed with 177000 and loaded into B.

        (B) <- 177000 OR ((ea) + (ea))

    Physical memory addressing: the instruction reads physical memory whether paging is on or off (it does affect the page tables if the address is inside the page table range). The effective address is

        ea = (T) + (X) + d

    where d is a 3-bit displacement (bits 3-5 of the instruction, 0 to 7). d is added to X first; a carry out of that addition is dropped and not added to T, so T always selects the 64K memory area.

    Privileged instruction.

    On computers with microprogram versions 015xx A-J (48-bit) or 026xx A-F (32-bit), LDBTX must be followed by a word containing 177777. On later versions (015xx K- or 026xx G-) that word is not needed but may stay in older programs (it may change the K bit).
  format: LDBTX <displacement>
  opcode: "143303"  # Octal, Δ denotes 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Memory Transfer Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 134
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2961 opcode_ldbtx_load_b_register_t_x_relative - never writes P (nd100x commit 936bf30)"
