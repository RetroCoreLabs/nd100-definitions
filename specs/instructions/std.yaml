instruction:
  name: "STD"
  description: |
    Store double word
      (ea)     ⟵ (A)
      (ea) + 1 ⟵ (D)

    Store the contents of the A register in the memory location pointed to by the effective address
    Store the contents of the D register in the memory location pointed to by the effective address plus one.
  opcode: "020000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "STD <addressing_mode> <displacement>"
  category: "Memory Transfer: Store"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 62
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2557 opcode_std_store_double_word - never writes P (nd100x commit 936bf30)"
