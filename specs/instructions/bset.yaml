instruction:
  name: BSET
  description: |
    Set specified bit in equal to specified condition
    
  detailed_description: |
    Set a bit.

    The selected bit is set according to the sub-instruction:

        BSET ZRO <bn> <dr>   bit <- 0                       174000
        BSET ONE <bn> <dr>   bit <- 1                       174200
        BSET BCM <bn> <dr>   bit <- not bit (complement)    174400
        BSET BAC <bn> <dr>   bit <- K                       174600

    Bit instructions work on one bit in a working register or in the STS register. Bits 11-15 of the instruction are all ones; bits 7-10 select the operation; bits 3-6 (bn) give the bit number, written in octal; bits 0-2 (dr) give the register.

        dr  register  mnemonic
        0   STS       (none, see below)
        1   D         DD
        2   P         DP
        3   B         DB
        4   L         DL
        5   A         DA
        6   T         DT
        7   X         DX

    Only eight STS bits can be used. They have their own compound mnemonics that combine bn and dr:

        SSPTM  STS bit 0  page table flag               00
        SSTG   STS bit 1  floating point rounding flag  10
        SSK    STS bit 2  one bit accumulator (K)       20
        SSZ    STS bit 3  error flag (Z)                30
        SSQ    STS bit 4  dynamic overflow flag (Q)     40
        SSO    STS bit 5  static overflow flag (O)      50
        SSC    STS bit 6  carry flag (C)                60
        SSM    STS bit 7  multi-shift link flag (M)     70

    K is the one bit accumulator (STS bit 2, mnemonic SSK).

    Examples from the manuals:

        BSET ZRO SSO       reset the static overflow flag
        BSET BCM 170 DT    complement the sign bit of T (complement a floating point number)

  opcode: "174000"  # Octal
  mask: "1111_1111_1000_0000" # top 9 bits are opcode
  format: "BSET <condition> <bit_no> <destination>"    
  category: "Bit Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 87
  instruction_class: "bit_instructions_with_condition"
  privilege: "user"
  examples:
    - description: "Reset the static overflow flag"
      code: "BSET ZRO SSO"

# when destionation is STS (0) then bits for bit_no  are 

# SSTG 000010  specifies floating rounding flag     B = TG
# SSK 000020  specifies 1-bit accumulator (K)       B = K
# SSZ 000030  specifies error flag (Z)              B = Z
# SSQ 000040  specifies dynamic overflow flag (Q)   B = Q
# SSO 000050  specifies static overflow flag (O)    B = O
# SSC 000060  specifies page table flag             B = C
# SSM 000070  specifies page table flag             B = M

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the register field is not P"
    - target: "result"
      when: "taken"
      condition: "the register field is P (2): a bit of P is changed and execution continues at the changed P"
  exits_source: "nd100x src/cpu/cpu_instr.c:1701 do_bops - cpu_setbit(dr, ...) writes the named register, which may be P (nd100x commit 936bf30)"
