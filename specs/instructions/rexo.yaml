instruction:
  name: "REXO"
  description: |
    Logical exclusive OR 
    
    (dr): = (dr) ⊕ (sr)

  detailed_description: |
    Optional sub instructions:
      CLD=1 Zero is used instead of the destination register as an operand (dr register contents are unchanged).
      CM1=1 The 1's complement of the source register is used as an operand (sr register contents are unchanged).
    
    Instruction combinations:

      REXO <sr> <dr>          dr ⟵ dr XOR sr
      REXO CLD <sr> <dr>      dr ⟵ sr
      REXO CML <sp> <dr>      dr ⟵ dr XOR sr's (1's complement)
      REXO CML CLD <sr> <dr>  dr ⟵ sr (1's complement)

  opcode: "0145000"  # Octal
  mask: "1111_1111_1100_0000"  # Matches bit pattern from image
  format: "REXO [flags] <source> <destination>"
  category: "Register Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 53
  instruction_class: "register_logical"
  privilege: "user"
  examples:
    - description: "Exclusive OR the contents of the B and Y registers, leaving the result in B"
      code: "REXO ST DB"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the destination register is not P"
    - target: "result"
      when: "taken"
      condition: "the destination register field is P (2)"
      note: "P is loaded with the result; reading P as a source gives the address of the next word"
  exits_source: "nd100x src/cpu/cpu_instr.c:1142 regop - register write in regop_logical()/regop_arith() (nd100x commit 936bf30)"
