instruction:
  name: SACB
  description: |
    Store the A register in the core map table bank (CMBNK).
    
    (ea) <--- (A)
    
    ea = (B) + Δ = CMBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)  

  detailed_description: |
    This instruction is privileged. It is only available to programs running in system mode (rings 2-3) and to programs running without memory protection.

    Store the A register in the core map table bank (CMBNK).

        (ea) <- (A)
        ea = (B) + Δ = CMBNK entry

    Δ is a 3-bit displacement, part of the instruction code, that is added to B. The word is written in the bank that holds the core map table.

  format: SACB <displacement>
  opcode: "140703"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 143
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6595 opcode_sacb_store_a_in_core_map_bank - never writes P (nd100x commit 936bf30)"
