instruction:
  name: "FDV"
  description: |
    Divide floating point accumulator

    The contents of the floating point accumulator (A and D registers) are divided by the contents of two sequential memory locations, pointed to by the effective address.   
  detailed_description: |
    Flags affected:
    - Division by zero sets the error flag (2).
    - This can be detected by the BSKP instruction
    
  opcode: "114000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "FDV <addressing_mode> <disp>"
  category: "Memory Transfer: Arithmetic and Logical"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 68
  instruction_class: "memory_transfer"
  privilege: "user"
  flags_affected:
    - Z  # Error

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3449 opcode_fdv_divide_floating_accumulator - never writes P (nd100x commit 936bf30)"
