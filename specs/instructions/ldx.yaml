instruction:
  name: "LDX"
  description: |
    Load X register
    
    (X) ⟵ (ea)
    
    Load the contents of the memory location pointed to by the effective address into the X register.
  opcode: "054000"  # Octal
  mask: "1111_1000_0000_0000" # top 5 bits are opcode
  format: "LDX <addressing_mode> <disp>"
  category: "Memory Transfer: Load"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 61
  instruction_class: "memory_transfer"
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2678 opcode_ldx_load_x_register - never writes P (nd100x commit 936bf30)"
