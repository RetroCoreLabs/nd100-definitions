instruction:
  name: SASB
  description: |
    Store the A register contents in the segment table bank (STBNK).
    
    (ea) <--- (A)
    
    ea = (B) + Δ = STBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)  
  format: SASB <displacement>
  opcode: "140701"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6547 opcode_sasb_store_a_in_segment_table_bank - never writes P (nd100x commit 936bf30)"
