instruction:
  name: SASB
  description: |
    Store the A register contents in the segment table bank (STBNK).
    
    (ea) <--- (A)
    
    ea = (B) + Δ = STBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)  

  detailed_description: |
    Store the A register in the segment table bank (STBNK).

        (ea) <- (A)
        ea = (B) + displacement = STBNK entry

    ea is (B) plus a 3-bit displacement that is part of the instruction code
    (bits 5-3, shown as the ? digit in the octal code 1407?1).

    Privileged instruction.

  format: SASB <displacement>
  opcode: "140701"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 143
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6547 opcode_sasb_store_a_in_segment_table_bank - never writes P (nd100x commit 936bf30)"
