instruction:
  name: LACB
  description: |
    Load the A register from the core map-table bank (CMBNK).
    
    (A) <--- (ea)
    
    ea = (B) + Δ = CMBNK entry
    
    Δ: 3-bit displacement added to B included in the instruction opcode (bits 5-3)
  format: LACB <displacement>
  opcode: "140702"  # Octal, Δ is a 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "Control Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6571 opcode_lacb_load_a_from_core_map_bank - never writes P (nd100x commit 936bf30)"
