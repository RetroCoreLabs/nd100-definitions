instruction:
  name: BLDC
  description: |
    Load complement

    K ⟵ NOT bit

    K gets the complement of bit <bn> of register <dr>.

    Source: ND-06.014 (ND-100 Reference Manual) section 3.2.2.6.3, One Bit Accumulator Instructions. K is the one-bit accumulator in the status register STS; <bn> is the bit number and <dr> the register.

  detailed_description: |
    Load bit complement to K.

        K <- not bit

    The complement of the selected bit is copied into K.

    Format: BLDC <bn> <dr>

    Bit instructions work on one bit in a working register or in the STS register. Bits 11-15 of the instruction are all ones; bits 7-10 select the operation; bits 3-6 (bn) give the bit number, written in octal; bits 0-2 (dr) give the register.

        dr  register  mnemonic
        0   STS       (none, see below)
        1   D         DD
        2   P         DP
        3   B         DB
        4   L         DL
        5   A         DA
        6   T         DT
        7   X         DX

    Only eight STS bits can be used. They have their own compound mnemonics that combine bn and dr:

        SSPTM  STS bit 0  page table flag               00
        SSTG   STS bit 1  floating point rounding flag  10
        SSK    STS bit 2  one bit accumulator (K)       20
        SSZ    STS bit 3  error flag (Z)                30
        SSQ    STS bit 4  dynamic overflow flag (Q)     40
        SSO    STS bit 5  static overflow flag (O)      50
        SSC    STS bit 6  carry flag (C)                60
        SSM    STS bit 7  multi-shift link flag (M)     70

    K is the one bit accumulator (STS bit 2, mnemonic SSK).

    This is one of the eight one bit accumulator instructions:

        BSTA  bit <- K, K <- 0            store and clear
        BSTC  bit <- not K, K <- 1        store complement and set
        BLDA  K <- bit                    load
        BLDC  K <- not bit                load complement
        BAND  K <- bit AND K              logical AND
        BANC  K <- (not bit) AND K        logical AND complement
        BORA  K <- bit OR K               logical OR
        BORC  K <- (not bit) OR K         logical OR complement

    These instructions take no ZRO/ONE/BCM/BAC sub-instruction; only BSET and BSKP do.

  opcode: "176400"  # Octal
  mask: "1111_1111_1000_0000" # top 9 bits are opcode
  format: "BLDC <bn> <dr>"
  category: "Bit Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 87
  privilege: "user"
  flags_affected:
    - K  # 1-bit accumulator (K)

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1701 do_bops - never writes P (nd100x commit 936bf30)"
