instruction:
  name: "RINC"
  description: |
    Register increment
    
    dr ⟵ dr + 1
    
    RINC is a compound mnemonic for RADD AD1.

  detailed_description: |
    Register increment.

        dr <- dr + 1

    RINC is another name for RADD AD1. The destination register is given in bits 2-0.

    Flags: the same as for RADD. C is set if there is a carry out of the sign position of the adder. If there is an overflow (both operands have the same sign and the result has the other sign), O and Q are set to 1. If there is no overflow, O is cleared and Q is left as it was.

    Example: RINC DA (146405₈) increments the A register by one.

  opcode: "146400"  # Octal
  mask: "1111_1111_1111_1000"  # Top 13 bits are opcode
  format: "RINC <destination>"
  category: "Register Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 54
  instruction_class: "register_dst"
  privilege: "user"
  flags_affected: ["C", "O", "Q"]  # See RADD instruction
  isalias: true
  examples:
    - description: "Increment the contents of the A register by one."
      code: "RINC DA"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "not_taken"
      condition: "the destination register is not P"
    - target: "result"
      when: "taken"
      condition: "the destination register field is P (2)"
      note: "P is loaded with the result; reading P as a source gives the address of the next word"
  exits_source: "nd100x src/cpu/cpu_instr.c:1142 regop - register write in regop_logical()/regop_arith() (nd100x commit 936bf30)"
