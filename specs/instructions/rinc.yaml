instruction:
  name: "RINC"
  description: |
    Register increment
    
    dr ⟵ dr + 1
    
    RINC is a compound mnemonic for RADD AD1.
  opcode: "146400"  # Octal
  mask: "1111_1111_1111_1000"  # Top 13 bits are opcode
  format: "RINC <destination>"
  category: "Register Operations"
  instruction_class: "register_dst"
  privilege: "user"
  flags_affected: ["C", "O", "Q"]  # See RADD instruction
  isalias: true
  examples:
    - description: "Increment the contents of the A register by one."
      code: "RINC DA" 