instruction:
  name: ADDD
  description: |
    Add two decimal operands.
    
    (op1) ⟵ (op1) + (op2)
    
    Add the second operand to the first operand, leaving the result in the first operand's location.
    
    If the first operand field is too short to contain all the significant digits of the result, then decimal overflow occurs.
    
    If bit 13 of D2 in the first operand is set, the sign of the result will be 17₈ (BCD unsigned).
    
    Any empty operand, that is with a field length of zero, is treated as a positive zero.
    
    **Instruction sequence:**
    
        ADDD
        error handling instruction
        next instruction after ADDD or after error handling routine
    
    Note:
    Operands should be normalized before this instruction is executed using the SHDE instruction.
    
    **Example:**
    
        ADDD
        JMP *12₈
        STX 20₈
    
    The ADDD instruction causes the program counter to skip the next instruction UNLESS an error has been generated. In this case, the instruction immediately after ADDD will handle the error in some way (in this example a jump is executed on error to ((P) + 12₈)).
    
    (* is the assembler mnemonic for the P register)

  detailed_description: |
    Add decimal.

        (op1) <- (op1) + (op2)

    The second operand is added to the first operand, and the sum is placed in the first operand's location. If needed, high-order zeros are applied to either operand.

    Decimal operands must be right adjusted, so that the least significant digit and the sign are in the last byte of the operand field. Each operand is given by a two-word descriptor: the first operand in the A and D registers, the second operand in the X and T registers. The operands are read into the register file before the operation, and the result is written back to memory.

    Decimal overflow occurs when the first operand field is too short to hold all significant digits of the sum. It has two possible causes:
    - a carry from the most significant digit position of the result field;
    - an oversized result: the second operand field is larger than the first, and significant result digits are lost.
    The field sizes alone do not show whether overflow will happen.

    The instruction does not scale automatically, so the operands must be aligned (normalised) first, for example with SHDE.

    If bit 13 of D2 in the first (destination) operand is set, the sign of the result is 17 octal (binary 1111, unsigned).

    An empty operand (field length 0) is treated as a positive zero.

    Format: ADDD

    Skip behaviour: the instruction after ADDD is the error return. With no error, ADDD skips it and execution continues at the second instruction after ADDD. On overflow, the next instruction is executed.

        ADDD
        JMP *12       error return: jump to (P) + 12 on overflow
        STX 20        normal return

    (* is the assembler mnemonic for the P register.)

  opcode: "0140120" # Octal
  format: "ADDD"
  mask: "1111_1111_1111_1111"
  category: "Decimal Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 101
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "error"
      condition: "an operand descriptor is bad, or the operation fails (overflow, lost digits or illegal code)"
    - offset: 2
      when: "ok"
  exits_source: "nd100x src/cpu/bcd.c:665 opcode_addd_add_two_decimal_operands - every early return leaves P at the next word; skip (gPC++) at line 686 (nd100x commit 936bf30)"
