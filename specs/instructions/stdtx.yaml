instruction:
  name: STDTX
  description: |
    Store double word
    
    (ea) ⟵ (A)
    (ea) + 1 ⟵ (D)
    
    Store the double word held in the A and D registers in the memory locations given by the effective address and the effective address plus one.
  format: STDTX <displacement>
  opcode: "143306"  # Octal, Δ denotes 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "SINTRAN III Memory Transfer Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:3046 opcode_stdtx_store_double_word_t_x_relative - never writes P (nd100x commit 936bf30)"
