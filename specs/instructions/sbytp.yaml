instruction:
  name: SBYTP
  description: |
    Store a byte in physical memory.
    
    (D) points to the bank number containing the byte array
    (T) points to the start of a byte array
    (X) points to the actual byte within the array

  detailed_description: |
    Store a byte in physical memory.

        (D) holds the number of the memory bank that holds the byte array
        (T) points to the start of the byte array
        (X) points to the byte within the array

    Format: SBYTP      Octal code: 140515

    Privileged instruction.

  format: SBYTP
  opcode: "140515"  # Octal
  mask: "1111_1111_1111_1111"
  category: "SINTRAN III Control Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 144
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:6394 opcode_sbytp_store_byte_in_physical_memory - never writes P (nd100x commit 936bf30)"
