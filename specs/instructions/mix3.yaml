instruction:
  name: MIX3
  description: |
    Multiply index by 3.
    
    (X) ⟵ [(A)-1] * 3
    
    Take the contents of the A register as an operand and subtract one. Multiply the result by three and place it in the X register.
    
  opcode: "143200" # Octal
  format: "MIX3"
  mask: "1111_1111_1111_1111"
  category: "Register Operations"
  instruction_class:
  privilege: "user" 