instruction:
  name: MIX3
  description: |
    Multiply index by 3.
    
    (X) ⟵ [(A)-1] * 3
    
    Take the contents of the A register as an operand and subtract one. Multiply the result by three and place it in the X register.

  detailed_description: |
    Multiply index by 3.

        (X) <- [(A) - 1] * 3

    The contents of the A register are taken as the operand, one is subtracted, the result is multiplied by three and placed in the X register. Only X is changed.

  opcode: "143200" # Octal
  format: "MIX3"
  mask: "1111_1111_1111_1111"
  category: "Register Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 46
  instruction_class:
  privilege: "user"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2334 opcode_mix3_multiply_index_by_three - never writes P (nd100x commit 936bf30)"
