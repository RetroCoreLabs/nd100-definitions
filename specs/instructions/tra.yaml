instruction:
  name: TRA
  description: |
    Transfer to A register
    The internal register given in the instruction is copied into the A register.  

  detailed_description: |
    Transfer to A register.

    The internal register named in the instruction is copied into the A
    register. The manual's table marks these registers as readable with TRA:

        code  register
        0     PANS  panel status
        1     STS   status
        2     OPR   operator panel switch
        3     PGS   paging status
        4     PVL   previous program level
        5     IIC   internal interrupt control
        6     PID   priority interrupt detect
        7     PIE   priority interrupt enable
        10    CSR   cache status
        11    ACTL  active level
        12    ALD   automatic load descriptor
        13    PES   parity error status
        14    PGC   paging control
        15    PEA   parity error address
        17    CS    control store (not on the ND-100)

    (codes octal)

    Format: TRA <register>      Octal code: 150000

    Privileged instruction.

  opcode: "0150000"  # Octal  
  format: "TRA <internal_register>"
  category: "Register Transfer Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 119
  instruction_class: #"register_transfer" 
  privilege: "privileged" # privileged instruction
  mask: "1111_1111_1111_0000" # top 12 bits are opcode
  bit_format: |
        +----------------------------+---------+
        | 15 -------------------- 4  | 3 --- 0 |
        +----------------------------+---------+
        | OpCode                     | Register|
        +----------------------------+---------+
  operands:
    - name: "opcode"        
      bits: "15-4"
      type: "opcode"
      description: "The opcode determines what type of operation occurs"
    - name: "internal_register"
      type: "enum"
      bits: "3-0"
      description: "The CPU internal register"               
      enum: # values are OCTAL
        - name: "PANS"
          value: "0000"
          description: "Panel status"
        - name: "STS"
          value: "0001"
          description: "Status register"
        - name: "OPR"
          value: "0002"
          description: "Operator's panel switch register"
        - name: "PSR"
          value: "0003"
          description: "Paging status register"
        - name: "PVL"
          value: "0004"
          description: "Previous level code register"
        - name: "IIC" 
          value: "0005"
          description: "Internal interrupt code register" 
        - name: "PID"
          value: "0006"
          description: "Priority interrupt detect register"
        - name: "PIE"
          value: "0007"
          description: "Priority enable detect register"
        - name: "CSR"
          value: "0010"
          description: "Cache status register"
        - name: "ACTL"
          value: "0011"
          description: "Active level register"          
        - name: "ALD"
          value: "0012"
          description: "Automatic load descriptor"
        - name: "PES"
          value: "0013"
          description: "Parity error status register"
        - name: "PGC"
          value: "0014"
          description: "Paging control register"
        - name: "PEA"
          value: "0015"
          description: "Parity error address register"
        - name: "CS"
          value: "0017"
          description: "Control store"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:1272 do_tra - never writes P (nd100x commit 936bf30)"
