instruction:
  name: LDDTX
  description: |
    Load double word
    
    (A) ⟵ (ea)
    (D) ⟵ (ea + 1)
    
    Load the contents of the physical memory location pointed to by the effective address into the A register and the contents of the effective address plus one into the D register.
  format: LDDTX <displacement>
  opcode: "143302"  # Octal, Δ denotes 3-bit displacement in bits 5-3
  mask: "1111_1111_1100_0111"
  category: "Memory Transfer Instructions"
  privilege: "privileged"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2927 opcode_lddtx_load_double_word_t_x_relative - never writes P (nd100x commit 936bf30)"
