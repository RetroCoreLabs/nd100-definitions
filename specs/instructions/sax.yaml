instruction:
  name: "SAX"
  description: "Set argument to X"

  detailed_description: |
    Set argument to X.

    The 8-bit argument (bits 0-7 of the instruction) is extended to 16 bits by
    sign extension and the result is loaded into the X register. The argument
    becomes the low byte; the high byte is filled with zeros for a positive
    argument and with ones for a negative argument (given in 2's complement form).

    Octal code: 171400.

  opcode: "171400"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "SAX <number>"
  category: "Argument Instructions"
  manual_refs:                # where the manuals describe it (manual ids: cpu.yaml metadata.manuals)
    - manual: "ND-06.029.1"
      page: 85
  privilege: "user"
  operands:
    - name: "opcode"
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  # no flags: the ND-110 manual names none for the set-argument instructions, and nd100x
  # (src/cpu/cpu_instr.c, cpu_setreg) only loads the register
  flags_affected: []
  examples:
    - description: "Set the X register to -5."
      code: "SAX -5"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2423 opcode_sax_set_argument_to_x - never writes P (nd100x commit 936bf30)"
