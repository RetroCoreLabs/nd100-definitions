instruction:
  name: "SAX"
  description: "Set argument to X"
  opcode: "171400"  # Octal
  mask: "1111_1111_0000_0000"  # Top 8 bits are the opcode
  format: "SAX <number>"
  category: "Argument Instructions"
  privilege: "user"
  operands:
    - name: "opcode"
      type: "opcode"
      bits: "15-8"
      description: "The opcode determines what type of operation occurs"
    - name: "number"
      type: "numeric"
      bits: "7-0"
      description: "8-bit argument extended to 16 bits using sign extension"
  flags_affected:
    - C  # Carry
    - O  # Overflow
  examples:
    - description: "Set the X register to -5."
      code: "SAX -5"

  # Where execution continues after this instruction (see schema field 'exits').
  exits:
    - offset: 1
      when: "always"
  exits_source: "nd100x src/cpu/cpu_instr.c:2423 opcode_sax_set_argument_to_x - never writes P (nd100x commit 936bf30)"
